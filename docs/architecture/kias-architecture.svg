<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" fill="none" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5F8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    
    <!-- Box shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="800" fill="#F8F9FA"/>
  
  <!-- Title -->
  <text x="500" y="35" font-size="18" font-weight="bold" fill="#1E3A5F" text-anchor="middle">KIAS System Architecture</text>
  
  <!-- Layer 1: Client Layer -->
  <rect x="50" y="55" width="900" height="80" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="75" font-size="11" fill="#666666" font-weight="bold">CLIENT LAYER</text>
  
  <rect x="70" y="85" width="120" height="40" rx="5" fill="url(#grad2)"/>
  <text x="130" y="109" font-size="12" fill="white" text-anchor="middle">CLI</text>
  
  <rect x="210" y="85" width="150" height="40" rx="5" fill="url(#grad2)"/>
  <text x="285" y="109" font-size="12" fill="white" text-anchor="middle">Dashboard</text>
  
  <rect x="380" y="85" width="120" height="40" rx="5" fill="url(#grad2)"/>
  <text x="440" y="109" font-size="12" fill="white" text-anchor="middle">SDK</text>
  
  <rect x="520" y="85" width="150" height="40" rx="5" fill="url(#grad2)"/>
  <text x="595" y="109" font-size="12" fill="white" text-anchor="middle">REST API</text>
  
  <rect x="690" y="85" width="150" height="40" rx="5" fill="url(#grad2)"/>
  <text x="765" y="109" font-size="12" fill="white" text-anchor="middle">WebSocket</text>
  
  <!-- Layer 2: API Gateway -->
  <rect x="50" y="160" width="900" height="80" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="180" font-size="11" fill="#666666" font-weight="bold">API GATEWAY</text>
  
  <rect x="70" y="190" width="140" height="40" rx="5" fill="url(#grad3)"/>
  <text x="140" y="214" font-size="12" fill="white" text-anchor="middle">Auth (JWT)</text>
  
  <rect x="230" y="190" width="140" height="40" rx="5" fill="url(#grad3)"/>
  <text x="300" y="214" font-size="12" fill="white" text-anchor="middle">Rate Limiter</text>
  
  <rect x="390" y="190" width="140" height="40" rx="5" fill="url(#grad3)"/>
  <text x="460" y="214" font-size="12" fill="white" text-anchor="middle">Load Balancer</text>
  
  <rect x="550" y="190" width="140" height="40" rx="5" fill="url(#grad3)"/>
  <text x="620" y="214" font-size="12" fill="white" text-anchor="middle">Circuit Breaker</text>
  
  <rect x="710" y="190" width="140" height="40" rx="5" fill="url(#grad3)"/>
  <text x="780" y="214" font-size="12" fill="white" text-anchor="middle">Health Check</text>
  
  <!-- Layer 3: Core Engine -->
  <rect x="50" y="265" width="900" height="80" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="285" font-size="11" fill="#666666" font-weight="bold">CORE ENGINE</text>
  
  <rect x="70" y="295" width="140" height="40" rx="5" fill="url(#grad1)"/>
  <text x="140" y="319" font-size="12" fill="white" text-anchor="middle">Controller</text>
  
  <rect x="230" y="295" width="140" height="40" rx="5" fill="url(#grad1)"/>
  <text x="300" y="319" font-size="12" fill="white" text-anchor="middle">Scheduler</text>
  
  <rect x="390" y="295" width="160" height="40" rx="5" fill="url(#grad1)"/>
  <text x="470" y="319" font-size="12" fill="white" text-anchor="middle">Workflow Engine</text>
  
  <rect x="570" y="295" width="140" height="40" rx="5" fill="url(#grad1)"/>
  <text x="640" y="319" font-size="12" fill="white" text-anchor="middle">Team Engine</text>
  
  <rect x="730" y="295" width="160" height="40" rx="5" fill="url(#grad1)"/>
  <text x="810" y="319" font-size="12" fill="white" text-anchor="middle">Goal Engine</text>
  
  <!-- Layer 4: Agent Runtime -->
  <rect x="50" y="370" width="900" height="80" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="390" font-size="11" fill="#666666" font-weight="bold">AGENT RUNTIME</text>
  
  <rect x="70" y="400" width="160" height="40" rx="5" fill="url(#grad4)"/>
  <text x="150" y="424" font-size="12" fill="white" text-anchor="middle">Agent Runtime</text>
  
  <rect x="250" y="400" width="140" height="40" rx="5" fill="url(#grad4)"/>
  <text x="320" y="424" font-size="12" fill="white" text-anchor="middle">Sandbox</text>
  
  <rect x="410" y="400" width="140" height="40" rx="5" fill="url(#grad4)"/>
  <text x="480" y="424" font-size="12" fill="white" text-anchor="middle">MCP Protocol</text>
  
  <rect x="570" y="400" width="160" height="40" rx="5" fill="url(#grad4)"/>
  <text x="650" y="424" font-size="12" fill="white" text-anchor="middle">Tool Registry</text>
  
  <rect x="750" y="400" width="140" height="40" rx="5" fill="url(#grad4)"/>
  <text x="820" y="424" font-size="12" fill="white" text-anchor="middle">Skills</text>
  
  <!-- Layer 5: Model Layer -->
  <rect x="50" y="475" width="900" height="80" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="495" font-size="11" fill="#666666" font-weight="bold">MODEL LAYER</text>
  
  <rect x="70" y="505" width="140" height="40" rx="5" fill="url(#grad5)"/>
  <text x="140" y="529" font-size="12" fill="white" text-anchor="middle">Model Router</text>
  
  <rect x="230" y="505" width="140" height="40" rx="5" fill="url(#grad5)"/>
  <text x="300" y="529" font-size="12" fill="white" text-anchor="middle">Key Rotation</text>
  
  <rect x="390" y="505" width="120" height="40" rx="5" fill="url(#grad5)"/>
  <text x="450" y="529" font-size="11" fill="white" text-anchor="middle">OpenAI</text>
  
  <rect x="530" y="505" width="120" height="40" rx="5" fill="url(#grad5)"/>
  <text x="590" y="529" font-size="11" fill="white" text-anchor="middle">Anthropic</text>
  
  <rect x="670" y="505" width="120" height="40" rx="5" fill="url(#grad5)"/>
  <text x="730" y="529" font-size="11" fill="white" text-anchor="middle">Ollama</text>
  
  <rect x="810" y="505" width="120" height="40" rx="5" fill="url(#grad5)"/>
  <text x="870" y="529" font-size="11" fill="white" text-anchor="middle">vLLM</text>
  
  <!-- Layer 6: Data Layer -->
  <rect x="50" y="580" width="900" height="80" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="600" font-size="11" fill="#666666" font-weight="bold">DATA LAYER</text>
  
  <rect x="70" y="610" width="140" height="40" rx="5" fill="url(#grad6)"/>
  <text x="140" y="634" font-size="12" fill="white" text-anchor="middle">SQLite</text>
  
  <rect x="230" y="610" width="140" height="40" rx="5" fill="url(#grad6)"/>
  <text x="300" y="634" font-size="12" fill="white" text-anchor="middle">Vector DB</text>
  
  <rect x="390" y="610" width="140" height="40" rx="5" fill="url(#grad6)"/>
  <text x="460" y="634" font-size="12" fill="white" text-anchor="middle">Cache</text>
  
  <rect x="550" y="610" width="140" height="40" rx="5" fill="url(#grad6)"/>
  <text x="620" y="634" font-size="12" fill="white" text-anchor="middle">Audit Log</text>
  
  <rect x="710" y="610" width="140" height="40" rx="5" fill="url(#grad6)"/>
  <text x="780" y="634" font-size="12" fill="white" text-anchor="middle">Dead Letter Q</text>
  
  <!-- Layer 7: Observability -->
  <rect x="50" y="685" width="900" height="70" rx="10" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
  <text x="70" y="705" font-size="11" fill="#666666" font-weight="bold">OBSERVABILITY</text>
  
  <rect x="70" y="715" width="140" height="35" rx="5" fill="#34495E"/>
  <text x="140" y="737" font-size="12" fill="white" text-anchor="middle">Prometheus</text>
  
  <rect x="230" y="715" width="140" height="35" rx="5" fill="#34495E"/>
  <text x="300" y="737" font-size="12" fill="white" text-anchor="middle">Grafana</text>
  
  <rect x="390" y="715" width="140" height="35" rx="5" fill="#34495E"/>
  <text x="460" y="737" font-size="12" fill="white" text-anchor="middle">Tracing</text>
  
  <rect x="550" y="715" width="140" height="35" rx="5" fill="#34495E"/>
  <text x="620" y="737" font-size="12" fill="white" text-anchor="middle">Metrics</text>
  
  <rect x="710" y="715" width="140" height="35" rx="5" fill="#34495E"/>
  <text x="780" y="737" font-size="12" fill="white" text-anchor="middle">Logs</text>
  
  <!-- Connection arrows (simplified) -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666666"/>
    </marker>
  </defs>
  
  <!-- Vertical connections -->
  <line x1="500" y1="135" x2="500" y2="160" stroke="#666666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="240" x2="500" y2="265" stroke="#666666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="345" x2="500" y2="370" stroke="#666666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="450" x2="500" y2="475" stroke="#666666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="555" x2="500" y2="580" stroke="#666666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="660" x2="500" y2="685" stroke="#666666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  
  <!-- Legend -->
  <rect x="860" y="20" width="120" height="25" rx="5" fill="url(#grad2)"/>
  <text x="920" y="37" font-size="10" fill="white" text-anchor="middle">KIAS v0.1.0</text>
</svg>
