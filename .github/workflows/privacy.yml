name: Privacy and secret gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-scan:
    name: Scan tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Scan for secrets, PII, and private organization identifiers
        id: scan
        continue-on-error: true
        env:
          ORGANIZATION_DENYLIST_B64: ${{ secrets.ORGANIZATION_DENYLIST_B64 }}
        run: |
          python3 scripts/privacy_scan.py \
            --repo . \
            --output privacy-scan.json \
            --fail-on high

      - name: Build masked finding summary
        if: steps.scan.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("privacy-scan.json")
          if not path.exists():
              raise SystemExit("privacy report was not generated")
          report = json.loads(path.read_text("utf-8"))
          lines = [
              "Privacy and secret gate found blocking items.",
              "",
              f"Summary: {json.dumps(report['summary'], sort_keys=True)}",
              "",
          ]
          for finding in report["findings"]:
              if finding["severity"] not in {"high", "critical"}:
                  continue
              lines.append(
                  f"{finding['severity']}: {finding['path']}:{finding['line']} "
                  f"{finding['kind']} {finding['masked']} "
                  f"fingerprint={finding['fingerprint']}"
              )
              if len(lines) >= 85:
                  lines.append("... additional findings omitted")
                  break
          lines.append("Values are masked; no full matching value is emitted.")
          Path("privacy-summary.txt").write_text("\n".join(lines), "utf-8")
          print("\n".join(lines))
          PY

      - name: Upload masked privacy diagnostics
        if: steps.scan.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privacy-diagnostics
          path: |
            privacy-summary.txt
            privacy-scan.json
          retention-days: 3

      - name: Enforce privacy gate
        if: steps.scan.outcome == 'failure'
        run: exit 1

  apply-test-warning-fixes:
    name: Apply reviewed test warning fixes once
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/privacy-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          fetch-depth: 2
          persist-credentials: true

      - name: Install stable Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Apply exact reviewed fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_exact(
              "crates/tool-executor/src/builtin.rs",
              '''        let result = tool.execute(serde_json::json!({"command": ""})).await;
        // Empty command should not panic - just return a result
        assert!(true); // Always true - just verifying no panic
''',
              '''        let _result = tool.execute(serde_json::json!({"command": ""})).await;
        // Returning from execute is sufficient for this no-panic regression test.
''',
          )

          replace_exact(
              "crates/tool-executor/src/builtin.rs",
              '''        let result = tool
            .execute(serde_json::json!({
                "path": "/root/impossible_file_12345.txt",
                "content": "test content"
            }))
            .await;
        // Should fail gracefully, not panic
        assert!(true); // Always true - just verifying no panic
''',
              '''        let _result = tool
            .execute(serde_json::json!({
                "path": "/root/impossible_file_12345.txt",
                "content": "test content"
            }))
            .await;
        // Returning from execute is sufficient for this no-panic regression test.
''',
          )

          replace_exact(
              "crates/tool-executor/src/vulnerability_scan.rs",
              '''        let result = scanner.scan("shell", &params, &default_ctx());
        // This might not be caught since pattern is "chmod +s" not numeric
        // Just verify no panic
        // u64 is always >= 0, this assertion is always true
''',
              '''        let _result = scanner.scan("shell", &params, &default_ctx());
        // Returning from scan is sufficient for this no-panic regression test.
''',
          )
          PY

          git show HEAD^:.github/workflows/privacy.yml > .github/workflows/privacy.yml
          git rm .github/workflows/fix-test-warnings-once.yml
          cargo fmt --all
          git diff HEAD --check

          changed="$(git diff --name-only HEAD | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/privacy.yml' \
            '.github/workflows/fix-test-warnings-once.yml' \
            'crates/tool-executor/src/builtin.rs' \
            'crates/tool-executor/src/vulnerability_scan.rs' | sort)"
          printf '%s\n' "${changed}"
          test "${changed}" = "${expected}"
          git add -A

      - name: Validate Core and workspace
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo test --all-features --locked --quiet
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked --quiet
          cargo fmt --all -- --check

      - name: Commit reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: make no-panic assertions warning-free"
          git push origin HEAD:agent/privacy-hardening
