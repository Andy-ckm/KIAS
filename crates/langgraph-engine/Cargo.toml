[package]
name = "kias-langgraph-engine"
version = "0.2.0"
edition = "2021"
description = "KIAS LangGraph-style State Graph Engine with typed channels, streaming, persistent checkpoints, and parallel execution"

[dependencies]
kias-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
