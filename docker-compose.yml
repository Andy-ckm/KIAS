version: '3.8'

services:
  kias:
    build: .
    ports:
      - "8080:8080"
      - "9090:9090"  # Metrics
    volumes:
      - kias-data:/app/data
      - ./config:/app/config:ro
    environment:
      - AgentGuard_LOG_LEVEL=info
      - AgentGuard_DB_PATH=/app/data/kias.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  kias-data:
