name: Apply reviewed tool test assertions once

on:
  push:
    branches:
      - agent/privacy-hardening

permissions:
  contents: write

concurrency:
  group: apply-reviewed-tool-test-assertions-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/privacy-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Apply exact reviewed test assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'crates/tool-executor/src/builtin.rs',
              '''        let result = tool.execute(serde_json::json!({"command": ""})).await;
          // Empty command should not panic - just return a result
          assert!(true); // Always true - just verifying no panic
          ''',
              '''        let result = tool.execute(serde_json::json!({"command": ""})).await;
          assert!(result.success);
          assert_eq!(
              result
                  .metadata
                  .as_ref()
                  .and_then(|value| value["exit_code"].as_i64()),
              Some(0)
          );
          ''',
          )

          replace_exact(
              'crates/tool-executor/src/builtin.rs',
              '''        // Test file write to a path that cannot be created (read-only location)
          let tool = FileWriteTool;
          let result = tool
              .execute(serde_json::json!({
                  "path": "/root/impossible_file_12345.txt",
                  "content": "test content"
              }))
              .await;
          // Should fail gracefully, not panic
          assert!(true); // Always true - just verifying no panic
          ''',
              '''        // /proc does not allow creating arbitrary regular files, including for root.
          let tool = FileWriteTool;
          let result = tool
              .execute(serde_json::json!({
                  "path": "/proc/1/kias-impossible-file.txt",
                  "content": "test content"
              }))
              .await;
          assert!(!result.success);
          assert!(result.error.is_some());
          ''',
          )

          replace_exact(
              'crates/tool-executor/src/vulnerability_scan.rs',
              '''        let result = scanner.scan("shell", &params, &default_ctx());
          // This might not be caught since pattern is "chmod +s" not numeric
          // Just verify no panic
          // u64 is always >= 0, this assertion is always true
          ''',
              '''        let result = scanner.scan("shell", &params, &default_ctx());
          // Numeric setuid detection is not guaranteed yet, but the aggregate score
          // must remain internally consistent for every scan result.
          assert_eq!(result.overall_risk, result.risk.overall());
          ''',
          )
          PY

          rustfmt --edition 2021 crates/tool-executor/src/builtin.rs crates/tool-executor/src/vulnerability_scan.rs
          git diff --check

      - name: Validate tool executor tests
        run: cargo test --locked -p tool-executor

      - name: Remove one-shot workflow and enforce allowlist
        run: |
          git rm .github/workflows/apply-tool-test-assertions-once.yml
          git add crates/tool-executor/src/builtin.rs crates/tool-executor/src/vulnerability_scan.rs
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-tool-test-assertions-once.yml' 'crates/tool-executor/src/builtin.rs' 'crates/tool-executor/src/vulnerability_scan.rs' | sort)"
          test "${changed}" = "${expected}"

      - name: Commit reviewed assertions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: assert real tool behavior"
          git push origin HEAD:agent/privacy-hardening
