    lesson: "bash脚本追加代码会与现有struct定义冲突，导致90个编译错误"
    solution: "用patch工具修改现有文件，不要追加重复定义"
    date: "2026-05-19"
  - id: L002
    lesson: "mod tests {} 闭合括号位置错误会导致测试函数在模块外"
    solution: "测试必须在mod tests {}内部，检查括号匹配"
    date: "2026-05-19"
  - id: L003
    lesson: "枚举值和字段名必须先查定义再写测试"
    solution: "grep 'pub enum' 和 'pub struct' 确认实际变体名"
    date: "2026-05-19"
  - id: L004
    lesson: "PDF文件被误提交到git"
    solution: "提交前检查git diff --cached，清理无关文件"
    date: "2026-05-19"

