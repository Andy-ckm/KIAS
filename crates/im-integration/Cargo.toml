[package]
name = "im-integration"
version = "0.1.0"
edition = "2021"
description = "KIAS IM Integration - WeChat/Telegram/Slack/Feishu with unified webhook interface"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
sha2 = "0.11"
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
