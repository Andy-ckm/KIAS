name: Apply Cargo lockfile once

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: lockfile-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Generate deterministic lockfile
        run: cargo generate-lockfile

      - name: Commit only the lockfile and remove this workflow
        run: |
          rm -f .github/workflows/lockfile-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/lockfile-preview.yml
          git diff --cached --name-only | grep -qx 'Cargo.lock'
          git diff --cached --name-only | grep -qx '.github/workflows/lockfile-preview.yml'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "build: refresh Cargo lockfile"
          git push origin HEAD:agent/privacy-hardening
