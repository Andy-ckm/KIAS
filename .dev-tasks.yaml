## 进化哲学

- mega task 完成 → 自动启动下一个 mega task
- 所有 mega task 完成 → 自动发现新方向（论文/竞品/用户反馈）
- 没有新方向 → 持续优化现有代码（测试/性能/安全）
- 永远有事做，永远在进化

