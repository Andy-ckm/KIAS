name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: read-all

jobs:
  release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify immutable tag and clean tree
        shell: bash
        run: |
          set -euo pipefail
          git verify-tag "$GITHUB_REF_NAME" 2>/dev/null || {
            echo "Tag is not signed or cannot be verified in this runner; continuing with the immutable GitHub tag ref."
          }
          test -z "$(git status --porcelain)"

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable

      - name: Test release package
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p kias-main

      - name: Build locked release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p kias-main --bin kias

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="kias-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${package}"
          install -m 0755 target/release/kias "dist/${package}/kias"
          install -m 0644 LICENSE README.md SECURITY.md PRIVACY.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (
            cd dist
            sha256sum "${package}.tar.gz" > SHA256SUMS
          )

      - name: Generate signed build provenance
        uses: actions/attest-build-provenance@21b787db45d5d4b6fc776b99a247a6493082d1fd # v4.1.1
        with:
          subject-path: dist/*.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "KIAS $GITHUB_REF_NAME"
