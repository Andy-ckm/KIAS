name: Preview reviewed Core quality fixes

on:
  push:
    branches:
      - agent/privacy-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: preview-core-quality-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Apply exact reviewed fixes in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "crates/tool-executor/src/builtin.rs",
              '''        let result = tool.execute(serde_json::json!({"command": ""})).await;
                  // Empty command should not panic - just return a result
                  assert!(true); // Always true - just verifying no panic
          ''',
              '''        let result = tool.execute(serde_json::json!({"command": ""})).await;
                  assert!(result.success);
                  assert_eq!(
                      result
                          .metadata
                          .as_ref()
                          .and_then(|value| value["exit_code"].as_i64()),
                      Some(0)
                  );
          ''',
          )
          replace_exact(
              "crates/tool-executor/src/builtin.rs",
              '''        // Test file write to a path that cannot be created (read-only location)
                  let tool = FileWriteTool;
                  let result = tool
                      .execute(serde_json::json!({
                          "path": "/root/impossible_file_12345.txt",
                          "content": "test content"
                      }))
                      .await;
                  // Should fail gracefully, not panic
                  assert!(true); // Always true - just verifying no panic
          ''',
              '''        // /proc does not allow creating arbitrary regular files, including for root.
                  let tool = FileWriteTool;
                  let result = tool
                      .execute(serde_json::json!({
                          "path": "/proc/1/kias-impossible-file.txt",
                          "content": "test content"
                      }))
                      .await;
                  assert!(!result.success);
                  assert!(result.error.is_some());
          ''',
          )
          replace_exact(
              "crates/tool-executor/src/vulnerability_scan.rs",
              '''        let result = scanner.scan("shell", &params, &default_ctx());
                  // This might not be caught since pattern is "chmod +s" not numeric
                  // Just verify no panic
                  // u64 is always >= 0, this assertion is always true
          ''',
              '''        let result = scanner.scan("shell", &params, &default_ctx());
                  // Numeric setuid detection is not guaranteed yet, but the aggregate score
                  // must remain internally consistent for every scan result.
                  assert_eq!(result.overall_risk, result.risk.overall());
          ''',
          )
          replace_exact(
              "crates/controller/src/runtime_loop.rs",
              '''    // ── Helper ──────────────────────────────────────────────────────────────

              fn fast_config() -> RuntimeLoopConfig {
                  RuntimeLoopConfig {
                      max_rounds: 5,
                      loop_timeout: Duration::from_secs(10),
                      round_timeout: Duration::from_secs(5),
                      quality_threshold: 0.8,
                      stop_on_achieve: true,
                      cooldown: Duration::ZERO,
                  }
              }

          ''',
              "",
          )
          replace_exact(
              "crates/common/src/metrics.rs",
              '.find(|mf| mf.get_name() == "kias_scheduler_latency_seconds")',
              '.find(|mf| mf.name() == "kias_scheduler_latency_seconds")',
          )
          replace_exact(
              "crates/common/src/tls.rs",
              '''        let key = b"not a pem file";
                  let err = validate_pem_files(cert, key.as_bytes()).unwrap_err();
          ''',
              '''        let key = b"not a pem file";
                  let err = validate_pem_files(cert, key).unwrap_err();
          ''',
          )
          PY

          cargo fmt --all
          git diff --check

      - name: Test Core default surface
        id: core_test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --quiet 2>&1 | tee core-tests.log

      - name: Lint Core default surface
        id: core_clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee core-clippy.log

      - name: Test complete workspace
        id: workspace_test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked --quiet 2>&1 | tee workspace-tests.log

      - name: Export reviewed patch
        if: always()
        run: git diff --binary > core-quality-fixes.patch

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-quality-fix-preview
          path: |
            core-quality-fixes.patch
            core-tests.log
            core-clippy.log
            workspace-tests.log
            crates/api-server/src/handlers/capabilities.rs
            crates/api-server/src/middleware/authorization.rs
            crates/api-server/src/routes/product.rs
            crates/api-server/src/surfaces.rs
            crates/common/src/metrics.rs
            crates/common/src/tls.rs
            crates/controller/src/runtime_loop.rs
            crates/tool-executor/src/builtin.rs
            crates/tool-executor/src/vulnerability_scan.rs
          if-no-files-found: error
          retention-days: 3

      - name: Enforce validation
        if: steps.core_test.outcome != 'success' || steps.core_clippy.outcome != 'success' || steps.workspace_test.outcome != 'success'
        run: exit 1
