[package]
name = "kias-harness-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Harness Engineering: artifact registry, validator, and evolution analyzer for AI Agent governance"

[dependencies]
# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Logging / Tracing
tracing = { workspace = true }

# Time
chrono = { workspace = true }

# Async traits
async-trait = { workspace = true }

# UUID
uuid = { workspace = true }

# Hashing for artifact integrity
sha2 = { workspace = true }
blake3 = { workspace = true }

# File system operations
tokio = { workspace = true, features = ["fs", "io-util"] }

# Pattern matching and validation
regex = "1"

# YAML parsing for AGENTS.md, SKILL.md
serde_yaml = "0.9"

# Indexing and search
tantivy = "0.22"  # Full-text search engine

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }
