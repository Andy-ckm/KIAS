name: Apply reviewed product maintenance once

on:
  push:
    branches:
      - agent/privacy-hardening

permissions:
  contents: write

concurrency:
  group: apply-product-maintenance-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/privacy-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Install stable Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Reproduce reviewed outputs
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          git rm .github/workflows/product-maintenance-preview.yml
          git add -A

      - name: Enforce exact file allowlist
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r file; do
            case "$file" in
              Cargo.lock|\
              crates/api-server/src/handlers/capabilities.rs|\
              crates/api-server/src/lib.rs|\
              crates/api-server/src/routes/mod.rs|\
              crates/api-server/src/routes/product.rs|\
              crates/api-server/src/surfaces.rs|\
              crates/kias-main/src/main.rs|\
              .github/workflows/product-maintenance-preview.yml)
                ;;
              *)
                echo "Unexpected maintenance change: $file" >&2
                unexpected=1
                ;;
            esac
          done < <(git diff --cached --name-only)
          test "$unexpected" -eq 0
          git diff --cached --check

      - name: Commit mechanical maintenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh lockfile and format product surfaces"
          git push origin HEAD:agent/privacy-hardening
