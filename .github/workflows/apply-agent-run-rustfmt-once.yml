name: Apply Agent Run rustfmt once

on:
  push:
    branches:
      - agent/privacy-hardening

permissions:
  contents: write

concurrency:
  group: apply-agent-run-rustfmt-once
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/privacy-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Install stable Rust with rustfmt
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Format and enforce exact scope
        run: |
          cargo fmt --all
          bash -n scripts/runtime-smoke-agent-run.sh
          git diff --check

          git rm .github/workflows/apply-agent-run-rustfmt-once.yml
          git rm .github/workflows/format-preview-agent-run.yml

          changed="$(git diff --name-only | sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/apply-agent-run-rustfmt-once.yml' \
            '.github/workflows/format-preview-agent-run.yml' \
            'crates/api-server/src/error.rs' \
            'crates/api-server/src/handlers/capabilities.rs' \
            'crates/api-server/src/handlers/mod.rs' \
            'crates/api-server/src/handlers/runs.rs' \
            'crates/api-server/src/lib.rs' \
            'crates/api-server/src/middleware/idempotency.rs' \
            'crates/api-server/src/models/mod.rs' \
            'crates/api-server/src/models/run.rs' \
            'crates/api-server/src/routes/mod.rs' \
            'crates/api-server/src/run_service.rs' \
            'crates/executor/src/docker_sandbox.rs' \
            'crates/executor/src/lib.rs' \
            'crates/kias-main/src/main.rs' | sort)"

          unexpected="$(comm -23 <(printf '%s\n' "${changed}") <(printf '%s\n' "${allowed}"))"
          if [[ -n "${unexpected}" ]]; then
            echo "Unexpected rustfmt changes:" >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

          git add -A
          staged="$(git diff --cached --name-only | sort)"
          test -n "${staged}"
          printf 'Staged files:\n%s\n' "${staged}"

      - name: Validate focused crates
        run: |
          cargo test --locked -p kias-executor -p kias-api-server -p kias-main
          cargo clippy --locked -p kias-executor -p kias-api-server -p kias-main --all-targets -- -D warnings

      - name: Commit reviewed formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Agent Run implementation"
          git push origin HEAD:agent/privacy-hardening
