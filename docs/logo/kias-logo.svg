<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-labelledby="title description">
  <title id="title">KIAS</title>
  <desc id="description">KIAS agent control plane: control, evidence, and recovery.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2b46"/>
      <stop offset="0.55" stop-color="#1a4b7a"/>
      <stop offset="1" stop-color="#2d7dd2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#7b68ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="900" height="240" fill="#0b1220" rx="18"/>
  <g opacity="0.18" stroke="#2d7dd2" stroke-width="1">
    <path d="M0 40h900M0 80h900M0 120h900M0 160h900M0 200h900"/>
    <path d="M60 0v240M120 0v240M180 0v240M240 0v240M300 0v240M360 0v240M420 0v240M480 0v240M540 0v240M600 0v240M660 0v240M720 0v240M780 0v240M840 0v240"/>
  </g>

  <g transform="translate(28 18)" filter="url(#shadow)">
    <path d="M92 6l72 20v85c0 43-26 72-72 92-46-20-72-49-72-92V26z" fill="url(#shield)" stroke="url(#accent)" stroke-width="3"/>
    <path d="M92 26l52 15v67c0 32-18 54-52 72-34-18-52-40-52-72V41z" fill="none" stroke="#00d4ff" stroke-opacity="0.45"/>
    <g transform="translate(55 58)" stroke="#00d4ff" stroke-width="3" fill="none" stroke-linecap="round">
      <rect x="17" y="17" width="40" height="40" rx="7"/>
      <path d="M37 17V4M37 70V57M17 37H4M70 37H57"/>
      <path d="M20 69l12 12 25-30" stroke="#45f0a8" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="225" y="105" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="5">KIAS</text>
  <line x1="225" y1="121" x2="575" y2="121" stroke="url(#accent)" stroke-width="3"/>
  <text x="225" y="158" fill="#a5b4c8" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="1.5">POLICY-DRIVEN AGENT CONTROL PLANE</text>

  <g transform="translate(225 183)" font-family="Arial, Helvetica, sans-serif" font-size="15">
    <rect width="112" height="32" rx="16" fill="#15324e" stroke="#00d4ff"/>
    <text x="56" y="21" text-anchor="middle" fill="#7ddfff">CONTROL</text>
    <rect x="126" width="112" height="32" rx="16" fill="#15324e" stroke="#7b68ee"/>
    <text x="182" y="21" text-anchor="middle" fill="#b8aaff">EVIDENCE</text>
    <rect x="252" width="112" height="32" rx="16" fill="#15324e" stroke="#45f0a8"/>
    <text x="308" y="21" text-anchor="middle" fill="#83f7bd">RECOVERY</text>
  </g>
</svg>