[workspace]
resolver = "2"
members = [
    "crates/kias-cli",
    "crates/langgraph-engine",
    "crates/common",
    "crates/api-server",
    "crates/scheduler",
    "crates/controller",
    "crates/knowledge",
    "crates/cache",
    "crates/monitor",
    "crates/executor",
    "crates/skills",
    "crates/kias-main",
    "crates/team-engine",
    "crates/goal-engine",
    "crates/agent-view",
    "crates/workflow-engine",
    "crates/autonomy-controller",
    "crates/mcp-protocol",
    "crates/data-store",
    "crates/data-governance",
    "crates/data-aggregator",
    "crates/model-router",
    "crates/llm-engine",
    "crates/tool-executor",
    "crates/agent-runtime",
    "crates/im-integration",
    "crates/auto-loop",
    "crates/it-change-management",
    "crates/linux-automation",
    "crates/document-management",
    "crates/compliance-security",
    "crates/harness-registry",
    # "crates/agentsight",
    # "crates/cache-hub",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kias-project/kias"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Metrics
prometheus = "0.13"
once_cell = "1"

# Config
config = "0.14"

# Hashing
sha2 = "0.10"
blake3 = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
csv = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Async utilities
futures = "0.3"

# Network
tonic = "0.12"
prost = "0.13"

# HTTP
axum = { version = "0.7", features = ["ws"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Storage
etcd-client = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# Utils
dashmap = "6"
url = "2"

# HTTP middleware / utilities
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Validation
validator = { version = "0.19", features = ["derive"] }

# Async traits
async-trait = "0.1"

# Random
rand = "0.8"

# Regex
regex = "1"

# JWT
jsonwebtoken = "9"

# Internal crates
kias-common = { path = "crates/common" }
kias-executor = { path = "crates/executor" }
