# 学到的教训
lessons:
  - id: L001
    lesson: "bash脚本追加代码会与现有struct定义冲突，导致90个编译错误"
    solution: "用patch工具修改现有文件，不要追加重复定义"
    date: "2026-05-19"
  - id: L002
    lesson: "mod tests {} 闭合括号位置错误会导致测试函数在模块外"
    solution: "测试必须在mod tests {}内部，检查括号匹配"
    date: "2026-05-19"
  - id: L003
    lesson: "枚举值和字段名必须先查定义再写测试"
    solution: "grep 'pub enum' 和 'pub struct' 确认实际变体名"
    date: "2026-05-19"
  - id: L004
    lesson: "PDF文件被误提交到git"
    solution: "提交前检查git diff --cached，清理无关文件"
    date: "2026-05-19"
  - id: L005
    lesson: "tower crate需要启用util feature才能使用ServiceExt::oneshot"
    solution: "tower = { version = \"0.4\", features = [\"util\"] }"
    date: "2026-05-19"
  - id: L006
    lesson: "Uuid类型没有is_empty()方法，应该用assert_ne!(id, Uuid::nil())"
    solution: "检查类型的方法集，不要假设String的方法适用于其他类型"
    date: "2026-05-19"
  - id: L007
    lesson: "task_type的Debug格式包含完整字段，不能直接assert_eq到枚举名"
    solution: "用contains()检查子串，不要assert_eq到简短名称"
    date: "2026-05-19"
  - id: L008
    lesson: "infer_resource_type对无/api/v1/前缀的路径也会singularize"
    solution: "写测试前先读函数实现，理解strip_prefix的unwrap_or行为"
    date: "2026-05-20"
  - id: L009
    lesson: "conn.lock().unwrap()是Mutex中毒风险，应该用map_err转换为业务错误"
    solution: "添加Poisoned错误变体，用.map_err(|e| Error::Poisoned(e.to_string()))?"
    date: "2026-05-20"
  - id: L010
    lesson: "PaginationParams有page和per_page字段，不是offset和limit"
    solution: "写测试前先读struct定义确认字段名"
    date: "2026-05-20"
  - id: L011
    lesson: "Arc<RwLock<...>>提供内部可变性，不需要mut绑定"
    solution: "只有需要rebind变量本身时才需要mut"
    date: "2026-05-20"

