[package]
name = "kias-it-change-management"
version = "0.1.0"
edition = "2021"
description = "医药/医疗器械企业IT系统变更管理模块"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
