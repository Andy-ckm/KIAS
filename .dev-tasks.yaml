## 自动发现新方向（当队列为空时）

discovery_sources:
  - "arXiv 论文（每 6 小时下载）"
  - "GitHub 竞品监控"
  - "用户反馈（微信消息）"
  - "技术趋势（HackerNews/Reddit）"
  - "合规法规更新（FDA/EU）"

discovery_process:
  1. 搜索新论文/竞品/趋势
  2. 提取可落地的 insight
  3. 生成新的 mega task
  4. 加入队列
  5. 继续进化

