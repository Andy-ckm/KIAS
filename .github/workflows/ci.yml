name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enforce Core, Extensions, and Labs boundaries
        run: |
          set -o pipefail
          python3 scripts/check_architecture.py 2>&1 | tee architecture.log

      - name: Upload architecture diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-diagnostics
          path: architecture.log
          retention-days: 3

  core-quality:
    name: Core tests and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust with Clippy
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - name: Test Core default surface
        run: |
          set -o pipefail
          RUSTFLAGS="-D warnings" cargo test --all-features --locked --quiet 2>&1 | tee core-tests.log

      - name: Lint Core default surface
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features --locked \
            --message-format=short -- -D warnings 2>&1 | tee core-clippy.log

      - name: Upload Core diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-quality-diagnostics
          path: |
            core-tests.log
            core-clippy.log
          if-no-files-found: ignore
          retention-days: 3

  workspace-compatibility:
    name: Full workspace compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Check every workspace crate
        run: |
          set -o pipefail
          cargo check --workspace --all-features --locked --quiet 2>&1 | tee workspace-check.log

      - name: Test every workspace crate
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked --quiet 2>&1 | tee workspace-tests.log

      - name: Upload workspace diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-compatibility-diagnostics
          path: |
            workspace-check.log
            workspace-tests.log
          if-no-files-found: ignore
          retention-days: 3

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install stable Rust with rustfmt
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Check formatting
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rust-format.log

      - name: Upload formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-format-diagnostics
          path: rust-format.log
          retention-days: 3

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint dashboard
        run: |
          set -o pipefail
          npm run lint -- --max-warnings=0 2>&1 | tee dashboard-lint.log

      - name: Build dashboard
        run: |
          set -o pipefail
          npm run build 2>&1 | tee dashboard-build.log

      - name: Upload dashboard diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-diagnostics
          path: |
            dashboard/dashboard-lint.log
            dashboard/dashboard-build.log
          if-no-files-found: ignore
          retention-days: 3
