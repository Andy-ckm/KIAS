[package]
name = "kias-mcp-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP (Model Context Protocol) client/server framework for KIAS"

[features]
default = []
http = ["dep:axum", "dep:async-stream", "dep:futures"]
auth = ["dep:base64", "dep:rand", "dep:hmac", "dep:sha2"]
resilience = []
metrics = []
credentials = ["dep:aes-gcm", "dep:rand"]
hot-reload = ["dep:serde_yaml"]
sandbox = []
docker = ["sandbox"]
browser = []
full = ["http", "auth", "resilience", "metrics", "credentials", "hot-reload", "sandbox", "docker", "browser"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true, optional = true }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

# HTTP transport
axum = { workspace = true, optional = true }
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }

# Auth dependencies
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

# Credentials dependencies
aes-gcm = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
