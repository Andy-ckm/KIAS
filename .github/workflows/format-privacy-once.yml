name: Apply reviewed formatting once

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: bounded-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Apply reviewed scanner and formatting changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/privacy_scan.py')
          text = path.read_text('utf-8')
          old = r're.compile(r"\b(?:sk|pk|xox[baprs]|api)[-_][A-Za-z0-9_-]{20,}\b", re.I),'
          new = r're.compile(r"\b(?:sk|pk|xox[baprs])[-_][A-Za-z0-9_-]{20,}\b", re.I),'
          if text.count(old) != 1:
              raise SystemExit('provider-token rule did not match exactly once')
          path.write_text(text.replace(old, new), 'utf-8')
          PY
          cargo fmt --all
          python3 scripts/privacy_scan.py --repo . --output /tmp/privacy-scan.json --fail-on high

      - name: Commit exact reviewed file set and remove workflow
        run: |
          rm -f .github/workflows/format-privacy-once.yml
          allowed='^(scripts/privacy_scan.py|crates/common/src/config.rs|crates/kias-main/src/main.rs|crates/kias-main/src/services/init.rs|crates/api-server/src/lib.rs|crates/api-server/src/handlers/mod.rs|crates/intent-core/src/lib.rs|.github/workflows/format-privacy-once.yml)$'
          unexpected="$(git status --short | sed 's/^...//' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/privacy_scan.py crates/common/src/config.rs \
            crates/kias-main/src/main.rs crates/kias-main/src/services/init.rs \
            crates/api-server/src/lib.rs crates/api-server/src/handlers/mod.rs \
            crates/intent-core/src/lib.rs .github/workflows/format-privacy-once.yml
          git commit -m "style: format hardening changes and refine privacy scan"
          git push origin HEAD:agent/privacy-hardening
