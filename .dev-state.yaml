# 学到的教训
lessons:
  - id: L001
    lesson: "bash脚本追加代码会与现有struct定义冲突，导致90个编译错误"
    solution: "用patch工具修改现有文件，不要追加重复定义"
    date: "2026-05-19"
  - id: L002
    lesson: "mod tests {} 闭合括号位置错误会导致测试函数在模块外"
    solution: "测试必须在mod tests {}内部，检查括号匹配"
    date: "2026-05-19"
  - id: L003
    lesson: "ChangeType和ChangeCategory枚举值容易搞混"
    solution: "先读函数签名确认参数顺序，再写测试"
    date: "2026-05-19"
  - id: L004
    lesson: "Vec没有values()方法，只有iter()"
    solution: "HashMap用values()，Vec用iter()"
    date: "2026-05-19"
  - id: L005
    lesson: "PDF文件被误提交到git（kias/docs/papers/）"
    solution: "提交前检查git diff --cached，清理无关文件"
    date: "2026-05-19"

