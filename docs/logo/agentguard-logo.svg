<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" fill="none">
  <defs>
    <!-- 主渐变：深蓝→青色 -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2B46;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A4B7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D7DD2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 强调渐变：青色→白色 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
    </linearGradient>
    
    <!-- 光晕效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 盾牌阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景装饰：细网格 -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a3a5c" stroke-width="0.3" opacity="0.3"/>
  </pattern>
  <rect width="900" height="240" fill="url(#grid)" opacity="0.5"/>
  
  <!-- 盾牌主体 -->
  <g transform="translate(25, 15)" filter="url(#shadow)">
    <!-- 盾牌外轮廓 -->
    <path d="M 95 10 
             L 170 30 
             L 170 120 
             Q 170 170 95 200 
             Q 20 170 20 120 
             L 20 30 
             Z" 
          fill="url(#shieldGrad)" 
          stroke="url(#accentGrad)" 
          stroke-width="2.5"/>
    
    <!-- 盾牌内部装饰线 -->
    <path d="M 95 25 
             L 155 42 
             L 155 115 
             Q 155 158 95 185 
             Q 35 158 35 115 
             L 35 42 
             Z" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="1" 
          opacity="0.4"/>
    
    <!-- AI 大脑/芯片图标 -->
    <g transform="translate(55, 55)">
      <!-- 中心处理器 -->
      <rect x="20" y="20" width="40" height="40" rx="4" 
            fill="none" stroke="#00D4FF" stroke-width="2" filter="url(#glow)"/>
      <rect x="28" y="28" width="24" height="24" rx="2" 
            fill="#00D4FF" opacity="0.3"/>
      <circle cx="40" cy="40" r="6" fill="#00D4FF"/>
      
      <!-- 上方连接线 -->
      <line x1="40" y1="20" x2="40" y2="5" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
      <circle cx="40" cy="3" r="3" fill="#00D4FF" opacity="0.6"/>
      
      <!-- 下方连接线 -->
      <line x1="40" y1="60" x2="40" y2="75" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
      <circle cx="40" cy="77" r="3" fill="#00D4FF" opacity="0.6"/>
      
      <!-- 左方连接线 -->
      <line x1="20" y1="40" x2="5" y2="40" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
      <circle cx="3" cy="40" r="3" fill="#00D4FF" opacity="0.6"/>
      
      <!-- 右方连接线 -->
      <line x1="60" y1="40" x2="75" y2="40" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
      <circle cx="77" cy="40" r="3" fill="#00D4FF" opacity="0.6"/>
      
      <!-- 左上角节点 -->
      <circle cx="10" cy="10" r="4" fill="#7B68EE" opacity="0.7"/>
      <line x1="10" y1="10" x2="25" y2="25" stroke="#7B68EE" stroke-width="1" opacity="0.5"/>
      
      <!-- 右上角节点 -->
      <circle cx="70" cy="10" r="4" fill="#7B68EE" opacity="0.7"/>
      <line x1="70" y1="10" x2="55" y2="25" stroke="#7B68EE" stroke-width="1" opacity="0.5"/>
      
      <!-- 左下角节点 -->
      <circle cx="10" cy="70" r="4" fill="#7B68EE" opacity="0.7"/>
      <line x1="10" y1="70" x2="25" y2="55" stroke="#7B68EE" stroke-width="1" opacity="0.5"/>
      
      <!-- 右下角节点 -->
      <circle cx="70" cy="70" r="4" fill="#7B68EE" opacity="0.7"/>
      <line x1="70" y1="70" x2="55" y2="55" stroke="#7B68EE" stroke-width="1" opacity="0.5"/>
    </g>
    
    <!-- 盾牌底部的对勾（合规标志） -->
    <g transform="translate(55, 140)">
      <path d="M 15 20 L 30 35 L 65 0" 
            fill="none" stroke="#00FF88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#glow)"/>
    </g>
  </g>
  
  <!-- 主标题：AgentGuard -->
  <text x="220" y="105" 
        font-family="'Segoe UI', Arial, Helvetica, sans-serif" 
        font-size="72" 
        font-weight="bold" 
        fill="white"
        letter-spacing="2">
    AgentGuard
  </text>
  
  <!-- 装饰线 -->
  <line x1="220" y1="118" x2="580" y2="118" 
        stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- 中文标语 -->
  <text x="220" y="148" 
        font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" 
        font-size="22" 
        fill="#00D4FF"
        letter-spacing="3">
    让 AI Agent 可追溯、透明、可控
  </text>
  
  <!-- 英文副标题 -->
  <text x="220" y="178" 
        font-family="'Segoe UI', Arial, Helvetica, sans-serif" 
        font-size="16" 
        fill="#8899AA"
        letter-spacing="1">
    Production-grade AI Agent Compliance &amp; Governance
  </text>
  
  <!-- 右侧装饰：三个状态指示灯 -->
  <g transform="translate(750, 60)">
    <!-- 可追溯 -->
    <circle cx="20" cy="20" r="8" fill="#00FF88" opacity="0.9"/>
    <text x="40" y="25" font-family="Arial" font-size="12" fill="#8899AA">可追溯</text>
    
    <!-- 透明 -->
    <circle cx="20" cy="50" r="8" fill="#00D4FF" opacity="0.9"/>
    <text x="40" y="55" font-family="Arial" font-size="12" fill="#8899AA">透明</text>
    
    <!-- 可控 -->
    <circle cx="20" cy="80" r="8" fill="#7B68EE" opacity="0.9"/>
    <text x="40" y="85" font-family="Arial" font-size="12" fill="#8899AA">可控</text>
  </g>
  
  <!-- 底部版本和徽章 -->
  <g transform="translate(220, 195)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="url(#shieldGrad)" stroke="#2D7DD2" stroke-width="1"/>
    <text x="40" y="16" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">Rust</text>
    
    <rect x="90" y="0" width="80" height="24" rx="12" fill="#1a4b7a" stroke="#00D4FF" stroke-width="1"/>
    <text x="130" y="16" font-family="Arial" font-size="11" fill="#00D4FF" text-anchor="middle">v0.3.0</text>
    
    <rect x="180" y="0" width="100" height="24" rx="12" fill="#1a4b7a" stroke="#00FF88" stroke-width="1"/>
    <text x="230" y="16" font-family="Arial" font-size="11" fill="#00FF88" text-anchor="middle">MIT License</text>
  </g>
</svg>
