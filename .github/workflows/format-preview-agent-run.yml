name: Apply reviewed Agent Run rustfmt once

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - "crates/api-server/**"
      - "crates/executor/**"
      - "docs/project-status.md"
      - ".github/workflows/format-preview-agent-run.yml"

permissions:
  contents: write

concurrency:
  group: apply-reviewed-agent-run-rustfmt-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/privacy-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORMAT_CHANGED: ${{ runner.temp }}/rustfmt-changed.txt
      FORMAT_STATUS: ${{ runner.temp }}/rustfmt-status.txt
      FORMAT_PATCH: ${{ runner.temp }}/rustfmt.patch
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Install stable Rust with rustfmt
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Generate reviewed formatting
        run: |
          set -euo pipefail
          cargo fmt --all
          bash -n scripts/runtime-smoke-agent-run.sh
          git rm .github/workflows/format-preview-agent-run.yml
          git diff --name-only HEAD | sort > "${FORMAT_CHANGED}"
          git diff HEAD > "${FORMAT_PATCH}"
          git status --short > "${FORMAT_STATUS}"
          cat "${FORMAT_CHANGED}"
          cat "${FORMAT_STATUS}"

      - name: Upload formatting diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-run-rustfmt-apply-diagnostics
          path: |
            ${{ runner.temp }}/rustfmt-changed.txt
            ${{ runner.temp }}/rustfmt-status.txt
            ${{ runner.temp }}/rustfmt.patch
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce bounded scope
        run: |
          set -euo pipefail
          git diff HEAD --check

          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/format-preview-agent-run.yml|\
              crates/api-server/src/error.rs|\
              crates/api-server/src/handlers/capabilities.rs|\
              crates/api-server/src/run_service.rs|\
              crates/executor/src/docker_sandbox.rs)
                ;;
              *)
                echo "Unexpected rustfmt change: ${path}" >&2
                exit 1
                ;;
            esac
          done < "${FORMAT_CHANGED}"

          grep -Fxq '.github/workflows/format-preview-agent-run.yml' "${FORMAT_CHANGED}"
          grep -Fxq 'crates/api-server/src/run_service.rs' "${FORMAT_CHANGED}"
          grep -Fxq 'crates/executor/src/docker_sandbox.rs' "${FORMAT_CHANGED}"
          git add -A

      - name: Validate focused crates
        run: |
          cargo test --locked -p kias-executor -p kias-api-server -p kias-main
          cargo clippy --locked -p kias-executor -p kias-api-server -p kias-main --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Commit reviewed formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Agent Run implementation"
          git push origin HEAD:agent/privacy-hardening
