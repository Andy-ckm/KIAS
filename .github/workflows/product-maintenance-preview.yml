name: Product maintenance preview

on:
  push:
    branches:
      - agent/privacy-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-maintenance-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Format Rust
        run: cargo fmt --all

      - name: Refresh lockfile
        id: lockfile
        continue-on-error: true
        run: cargo generate-lockfile

      - name: Record lockfile diagnostics
        if: steps.lockfile.outcome != 'success'
        run: echo "Cargo.lock refresh failed" > product-maintenance-error.txt

      - name: Upload reviewed maintenance outputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-maintenance-preview
          path: |
            Cargo.lock
            product-maintenance-error.txt
            crates/api-server/src/lib.rs
            crates/api-server/src/routes/product.rs
            crates/api-server/src/surfaces.rs
            crates/kias-main/src/main.rs
          if-no-files-found: error
          retention-days: 3

      - name: Enforce lockfile refresh
        if: steps.lockfile.outcome != 'success'
        run: exit 1
