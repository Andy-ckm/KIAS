name: Preview reviewed Core and dependency fixes

on:
  push:
    branches:
      - agent/privacy-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: preview-core-quality-fixes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Apply exact reviewed fixes in workspace
        run: |
          set -o pipefail
          python3 scripts/apply_reviewed_core_fixes.py 2>&1 | tee apply.log
          python3 scripts/apply_reviewed_followup_fixes.py 2>&1 | tee -a apply.log
          python3 scripts/apply_sqlite_compat_fix.py 2>&1 | tee -a apply.log
          cargo fmt --all 2>&1 | tee -a apply.log
          cargo generate-lockfile -vv 2>&1 | tee -a apply.log
          git diff --check 2>&1 | tee -a apply.log

      - name: Test Core default surface
        id: core_test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --quiet 2>&1 | tee core-tests.log

      - name: Lint Core default surface
        id: core_clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee core-clippy.log

      - name: Test complete workspace
        id: workspace_test
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked --quiet 2>&1 | tee workspace-tests.log

      - name: Export reviewed patch
        if: always()
        run: git diff --binary > core-quality-fixes.patch

      - name: Upload preview evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-quality-fix-preview
          path: |
            apply.log
            core-quality-fixes.patch
            core-tests.log
            core-clippy.log
            workspace-tests.log
            Cargo.toml
            Cargo.lock
            crates/api-server/Cargo.toml
            crates/api-server/src/handlers/capabilities.rs
            crates/api-server/src/handlers/config.rs
            crates/api-server/src/handlers/dashboard.rs
            crates/api-server/src/middleware/authorization.rs
            crates/api-server/src/routes/product.rs
            crates/api-server/src/surfaces.rs
            crates/auto-loop/src/deployer.rs
            crates/common/src/metrics.rs
            crates/common/src/tls.rs
            crates/compliance-security/src/auth_providers.rs
            crates/controller/src/runtime_loop.rs
            crates/controller/src/state.rs
            crates/data-governance/Cargo.toml
            crates/data-store/Cargo.toml
            crates/document-management/Cargo.toml
            crates/it-change-management/Cargo.toml
            crates/kias-main/src/main.rs
            crates/kias-main/src/services/init.rs
            crates/linux-automation/Cargo.toml
            crates/tool-executor/src/builtin.rs
            crates/tool-executor/src/vulnerability_scan.rs
          if-no-files-found: error
          retention-days: 3

      - name: Enforce validation
        if: steps.core_test.outcome != 'success' || steps.core_clippy.outcome != 'success' || steps.workspace_test.outcome != 'success'
        run: exit 1
