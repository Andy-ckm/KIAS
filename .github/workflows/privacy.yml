name: Privacy and secret gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "41 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  privacy-scan:
    name: Scan tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Scan for secrets, PII, and private organization identifiers
        id: scan
        continue-on-error: true
        env:
          ORGANIZATION_DENYLIST_B64: ${{ secrets.ORGANIZATION_DENYLIST_B64 }}
        run: |
          python3 scripts/privacy_scan.py \
            --repo . \
            --output privacy-scan.json \
            --fail-on high

      - name: Build masked finding summary
        if: steps.scan.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("privacy-scan.json")
          if not path.exists():
              raise SystemExit("privacy report was not generated")
          report = json.loads(path.read_text("utf-8"))
          lines = [
              "Privacy and secret gate found blocking items.",
              "",
              f"Summary: `{json.dumps(report['summary'], sort_keys=True)}`",
              "",
              "```text",
          ]
          for finding in report["findings"]:
              if finding["severity"] not in {"high", "critical"}:
                  continue
              lines.append(
                  f"{finding['severity']}: {finding['path']}:{finding['line']} "
                  f"{finding['kind']} {finding['masked']} "
                  f"fingerprint={finding['fingerprint']}"
              )
              if len(lines) >= 85:
                  lines.append("... additional findings omitted")
                  break
          lines.append("```")
          lines.append("")
          lines.append("Values are masked; the comment does not contain full matching data.")
          Path("/tmp/privacy-comment.md").write_text("\n".join(lines), "utf-8")
          print("\n".join(lines))
          PY

      - name: Comment on same-repository pull request
        if: >-
          steps.scan.outcome == 'failure' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/privacy-comment.md

      - name: Enforce privacy gate
        if: steps.scan.outcome == 'failure'
        run: exit 1
