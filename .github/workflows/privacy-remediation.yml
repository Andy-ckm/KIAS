name: Apply privacy remediation

on:
  push:
    branches:
      - agent/privacy-hardening

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[privacy-remediation]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text("utf-8")

          def write(path, content):
              Path(path).write_text(content, "utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, got {count}: {old[:80]!r}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, flags=0):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"expected one regex match in {path}, got {count}: {pattern[:80]!r}")
              write(path, updated)

          # Workspace security dependencies.
          replace_once(
              "Cargo.toml",
              'sha2 = "0.10"\nblake3 = "1"',
              'sha2 = "0.10"\nsha1 = "0.10"\nhmac = "0.12"\nargon2 = "0.5"\nzeroize = { version = "1", features = ["derive"] }\nblake3 = "1"',
          )
          replace_once(
              "crates/common/Cargo.toml",
              'sha2 = { workspace = true }\nblake3 = { workspace = true }',
              'sha2 = { workspace = true }\nsha1 = { workspace = true }\nhmac = { workspace = true }\nargon2 = { workspace = true }\nzeroize = { workspace = true }\nrand = { workspace = true }\nblake3 = { workspace = true }',
          )
          replace_once(
              "crates/compliance-security/Cargo.toml",
              'hmac = "0.12"\nlibc = "0.2"',
              'hmac = "0.12"\nzeroize = { workspace = true }\nlibc = "0.2"',
          )
          replace_once(
              "crates/im-integration/Cargo.toml",
              'sha2 = "0.10"\nhex = "0.4"',
              'sha2 = "0.10"\nhmac = "0.12"\nhex = "0.4"',
          )

          # Pseudonymous audit identities and redacted Debug output.
          path = "crates/common/src/audit.rs"
          text = read(path)
          text = text.replace(
              "use chrono::{DateTime, Utc};\nuse std::collections::VecDeque;",
              "use chrono::{DateTime, Utc};\nuse sha2::{Digest, Sha256};\nuse std::collections::VecDeque;",
              1,
          )
          text = text.replace(
              "#[derive(Debug, Clone, PartialEq, Eq)]\npub struct AuditEvent",
              "#[derive(Clone, PartialEq, Eq)]\npub struct AuditEvent",
              1,
          )
          marker = "impl AuditEvent {\n"
          addition = '''/// Convert a potentially identifying subject into a stable pseudonym.\n///\n/// Deployments that require cross-system correlation should replace this with\n/// an HMAC keyed by a deployment-specific secret. Raw identities must not be\n/// written to application logs.\npub fn pseudonymize_identifier(identifier: &str) -> String {\n    match identifier {\n        "system" | "unknown" | "api-key-user" => identifier.to_string(),\n        _ => {\n            let mut hasher = Sha256::new();\n            hasher.update(identifier.as_bytes());\n            let digest = format!("{:x}", hasher.finalize());\n            format!("subject:{}", &digest[..16])\n        }\n    }\n}\n\nimpl fmt::Debug for AuditEvent {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        f.debug_struct("AuditEvent")\n            .field("id", &self.id)\n            .field("timestamp", &self.timestamp)\n            .field("actor", &"[PSEUDONYMOUS]")\n            .field("action", &self.action)\n            .field("resource_type", &self.resource_type)\n            .field("resource_id", &"[REDACTED]")\n            .field("details", &"[REDACTED]")\n            .field("ip_address", &self.ip_address.as_ref().map(|_| "[REDACTED]"))\n            .field("user_agent", &self.user_agent.as_ref().map(|_| "[REDACTED]"))\n            .field("outcome", &self.outcome)\n            .finish()\n    }\n}\n\n'''
          if marker not in text:
              raise SystemExit("AuditEvent impl marker not found")
          text = text.replace(marker, addition + marker, 1)
          write(path, text)

          path = "crates/api-server/src/middleware/auth.rs"
          text = read(path)
          text = text.replace(
              "use kias_common::audit::{AuditAction, AuditEvent, AuditOutcome};",
              "use kias_common::audit::{pseudonymize_identifier, AuditAction, AuditEvent, AuditOutcome};",
              1,
          )
          text = text.replace(
              'tracing::debug!(sub = %claims.sub, role = %claims.role, "JWT auth succeeded");',
              'tracing::debug!(role = %claims.role, "JWT auth succeeded");',
              1,
          )
          text = text.replace(
              "            let audit_event = AuditEvent::new(\n                &claims.sub,",
              "            let audit_actor = pseudonymize_identifier(&claims.sub);\n            let audit_event = AuditEvent::new(\n                &audit_actor,",
              1,
          )
          text = text.replace(
              'tracing::debug!(audit = ?audit_event, "audit: login success");',
              'tracing::debug!(audit_id = %audit_event.id, "audit: login success");',
              1,
          )
          text = text.replace(
              'tracing::debug!(audit = ?audit_event, "audit: login failure (no keys)");',
              'tracing::debug!(audit_id = %audit_event.id, "audit: login failure (no keys)");',
              1,
          )
          text = text.replace(
              'tracing::debug!(audit = ?audit_event, "audit: login failure");',
              'tracing::debug!(audit_id = %audit_event.id, "audit: login failure");',
              1,
          )
          write(path, text)

          path = "crates/api-server/src/handlers/config.rs"
          text = read(path)
          text = text.replace(
              "use kias_common::audit::{AuditAction, AuditEvent, AuditLogger, AuditOutcome};",
              "use kias_common::audit::{pseudonymize_identifier, AuditAction, AuditEvent, AuditLogger, AuditOutcome};",
              1,
          )
          text = text.replace(
              "Some(axum::extract::Extension(c)) => (c.sub.clone(), c.role == Role::Admin),",
              "Some(axum::extract::Extension(c)) => (pseudonymize_identifier(&c.sub), c.role == Role::Admin),",
              1,
          )
          write(path, text)

          # Password hashing, standard TOTP, one-time recovery codes, and redacted users.
          path = "crates/common/src/gxp_auth.rs"
          text = read(path)
          text = text.replace(
              "use chrono::{DateTime, Duration, Utc};\nuse serde::{Deserialize, Serialize};\nuse sha2::{Digest, Sha256};",
              "use argon2::{password_hash::{PasswordHash, PasswordHasher, SaltString}, Argon2, PasswordVerifier};\nuse chrono::{DateTime, Duration, Utc};\nuse hmac::{Hmac, Mac};\nuse rand::{rngs::OsRng, RngCore};\nuse serde::{Deserialize, Serialize};\nuse sha1::Sha1;\nuse sha2::{Digest, Sha256};",
              1,
          )
          text = text.replace(
              "    /// The new password matches one of the recently used passwords.\n    PasswordReused,",
              "    /// The new password matches one of the recently used passwords.\n    PasswordReused,\n    /// A secure password hash could not be generated.\n    PasswordHashingFailed,",
              1,
          )
          text = text.replace(
              "            Self::PasswordReused => {\n                write!(f, \"Password matches a recently used password\")\n            }",
              "            Self::PasswordReused => {\n                write!(f, \"Password matches a recently used password\")\n            }\n            Self::PasswordHashingFailed => write!(f, \"Password hashing failed\"),",
              1,
          )
          text = text.replace(
              "#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct GxpUser",
              "#[derive(Clone, Serialize, Deserialize)]\npub struct GxpUser",
              1,
          )
          text = text.replace(
              "    pub password_hash: String,",
              "    #[serde(skip_serializing)]\n    pub password_hash: String,",
              1,
          )
          text = text.replace(
              "    pub password_history: Vec<String>,",
              "    #[serde(skip_serializing)]\n    pub password_history: Vec<String>,",
              1,
          )
          text = text.replace(
              "    pub two_factor_secret: Option<String>,",
              "    #[serde(skip_serializing)]\n    pub two_factor_secret: Option<String>,",
              1,
          )
          user_marker = "// ── Session (§11.200(a)(1))"
          user_debug = '''impl fmt::Debug for GxpUser {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        f.debug_struct("GxpUser")\n            .field("user_id", &self.user_id)\n            .field("username", &self.username)\n            .field("display_name", &"[REDACTED]")\n            .field("email", &"[REDACTED]")\n            .field("password_hash", &"[REDACTED]")\n            .field("password_history", &"[REDACTED]")\n            .field("is_active", &self.is_active)\n            .field("roles", &self.roles)\n            .field("created_at", &self.created_at)\n            .field("updated_at", &self.updated_at)\n            .field("failed_login_attempts", &self.failed_login_attempts)\n            .field("locked_until", &self.locked_until)\n            .field("two_factor_enabled", &self.two_factor_enabled)\n            .field("two_factor_secret", &"[REDACTED]")\n            .finish()\n    }\n}\n\n'''
          if user_marker not in text:
              raise SystemExit("GxpUser insertion marker not found")
          text = text.replace(user_marker, user_debug + user_marker, 1)

          password_pattern = re.compile(
              r"/// Hash a password using SHA-256\..*?fn verify_password\(password: &str, hash: &str\) -> bool \{.*?\n\}\n",
              re.S,
          )
          password_replacement = '''/// Hash a password with Argon2id and a unique random salt.\nfn hash_password(password: &str) -> Result<String, AuthError> {\n    let salt = SaltString::generate(&mut OsRng);\n    Argon2::default()\n        .hash_password(password.as_bytes(), &salt)\n        .map(|hash| hash.to_string())\n        .map_err(|_| AuthError::PasswordHashingFailed)\n}\n\n/// Verify a password against a PHC-formatted Argon2id hash.\nfn verify_password(password: &str, hash: &str) -> bool {\n    let Ok(parsed) = PasswordHash::new(hash) else {\n        return false;\n    };\n    Argon2::default()\n        .verify_password(password.as_bytes(), &parsed)\n        .is_ok()\n}\n'''
          text, count = password_pattern.subn(password_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"password helper replacement failed: {count}")

          totp_pattern = re.compile(
              r"/// Generate a simple TOTP-like 6-digit code.*?fn generate_totp\(secret: &str, now: DateTime<Utc>\) -> String \{.*?\n\}\n",
              re.S,
          )
          totp_replacement = '''/// Generate an RFC 6238 compatible six-digit TOTP using HMAC-SHA1.\nfn generate_totp(secret: &str, now: DateTime<Utc>) -> String {\n    let secret_bytes = hex_decode(secret).unwrap_or_default();\n    if secret_bytes.is_empty() {\n        return "000000".to_string();\n    }\n    let counter = (now.timestamp().max(0) as u64) / 30;\n    let mut mac = Hmac::<Sha1>::new_from_slice(&secret_bytes)\n        .expect("HMAC accepts keys of any length");\n    mac.update(&counter.to_be_bytes());\n    let digest = mac.finalize().into_bytes();\n    let offset = (digest[digest.len() - 1] & 0x0f) as usize;\n    let binary = ((u32::from(digest[offset]) & 0x7f) << 24)\n        | (u32::from(digest[offset + 1]) << 16)\n        | (u32::from(digest[offset + 2]) << 8)\n        | u32::from(digest[offset + 3]);\n    format!("{:06}", binary % 1_000_000)\n}\n\nfn hash_recovery_code(code: &str) -> String {\n    let mut hasher = Sha256::new();\n    hasher.update(code.as_bytes());\n    hex_encode(&hasher.finalize())\n}\n\nfn hex_decode(value: &str) -> Option<Vec<u8>> {\n    if value.len() % 2 != 0 {\n        return None;\n    }\n    (0..value.len())\n        .step_by(2)\n        .map(|index| u8::from_str_radix(&value[index..index + 2], 16).ok())\n        .collect()\n}\n'''
          text, count = totp_pattern.subn(totp_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"TOTP helper replacement failed: {count}")

          text = text.replace("password_hash: hash_password(password),", "password_hash: hash_password(password)?,", 1)
          text = text.replace("let new_hash = hash_password(new_password);", "let new_hash = hash_password(new_password)?;", 1)
          text = text.replace("if *old_hash == new_hash {", "if verify_password(new_password, old_hash) {", 1)
          text = text.replace("if user.password_hash == new_hash {", "if verify_password(new_password, &user.password_hash) {", 1)
          text = text.replace(
              "        let secret = Uuid::new_v4().to_string().replace('-', \"\");",
              "        let mut secret_bytes = [0_u8; 20];\n        OsRng.fill_bytes(&mut secret_bytes);\n        let secret = hex_encode(&secret_bytes);",
              1,
          )
          old_config = '''        let config = TwoFactorConfig {\n            enabled: true,\n            method: TwoFactorMethod::Totp,\n            backup_codes: backup_codes.clone(),\n        };\n        self.two_factor_configs\n            .insert(user_id.to_string(), config.clone());'''
          new_config = '''        let stored_config = TwoFactorConfig {\n            enabled: true,\n            method: TwoFactorMethod::Totp,\n            backup_codes: backup_codes\n                .iter()\n                .map(|code| hash_recovery_code(code))\n                .collect(),\n        };\n        self.two_factor_configs\n            .insert(user_id.to_string(), stored_config);\n\n        // Recovery codes are returned exactly once; only hashes are retained.\n        let enrollment_config = TwoFactorConfig {\n            enabled: true,\n            method: TwoFactorMethod::Totp,\n            backup_codes,\n        };'''
          if old_config not in text:
              raise SystemExit("2FA config block not found")
          text = text.replace(old_config, new_config, 1)
          text = text.replace("        Ok(config)\n", "        Ok(enrollment_config)\n", 1)

          backup_pattern = re.compile(
              r"        // Check backup codes\n        if let Some\(config\) = self\.two_factor_configs\.get\(user_id\) \{\n            if config\.backup_codes\.iter\(\)\.any\(\|bc\| bc == code\) \{.*?                return Ok\(true\);\n            \}\n        \}",
              re.S,
          )
          backup_replacement = '''        // Check a recovery code by hash and consume it atomically on success.\n        let code_hash = hash_recovery_code(code);\n        let used_recovery_code = self\n            .two_factor_configs\n            .get_mut(user_id)\n            .and_then(|config| {\n                config\n                    .backup_codes\n                    .iter()\n                    .position(|stored| stored == &code_hash)\n                    .map(|index| config.backup_codes.remove(index))\n            })\n            .is_some();\n        if used_recovery_code {\n            self.audit_log.push(AuthAuditEvent {\n                timestamp: now,\n                user_id: user_id.to_string(),\n                event_type: AuthEventType::TwoFactorVerified,\n                detail: "Recovery code used".into(),\n                ip_address: None,\n            });\n            return Ok(true);\n        }'''
          text, count = backup_pattern.subn(backup_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"backup-code replacement failed: {count}")
          write(path, text)

          path = "crates/api-server/src/handlers/auth_gxp.rs"
          text = read(path)
          text = text.replace(
              "        AuthError::PasswordReused => (StatusCode::BAD_REQUEST, \"PASSWORD_REUSED\"),",
              "        AuthError::PasswordReused => (StatusCode::BAD_REQUEST, \"PASSWORD_REUSED\"),\n        AuthError::PasswordHashingFailed => (\n            StatusCode::INTERNAL_SERVER_ERROR,\n            \"PASSWORD_HASHING_FAILED\",\n        ),",
              1,
          )
          write(path, text)

          # Credential objects may be serialized for diagnostics, but never with values.
          path = "crates/compliance-security/src/auth_providers.rs"
          text = read(path)
          text = text.replace(
              "use serde::{Deserialize, Serialize};",
              "use serde::{ser::SerializeStruct, Deserialize, Serialize};\nuse zeroize::{Zeroize, ZeroizeOnDrop};",
              1,
          )
          text = text.replace(
              "#[derive(Debug, Clone, Serialize, Deserialize)]\n#[serde(tag = \"type\", rename_all = \"snake_case\")]\npub enum AuthCredential",
              "#[derive(Clone, Deserialize, Zeroize, ZeroizeOnDrop)]\n#[serde(tag = \"type\", rename_all = \"snake_case\")]\npub enum AuthCredential",
              1,
          )
          credential_marker = "// ── Auth Result"
          credential_impl = '''impl fmt::Debug for AuthCredential {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        let credential_type = match self {\n            Self::Password { .. } => "password",\n            Self::JwtToken { .. } => "jwt_token",\n            Self::OAuth2Token { .. } => "oauth2_token",\n            Self::Scram { .. } => "scram",\n            Self::ApiKey { .. } => "api_key",\n            Self::Certificate { .. } => "certificate",\n            Self::LdapBind { .. } => "ldap_bind",\n            Self::SamlAssertion { .. } => "saml_assertion",\n            Self::OidcIdToken { .. } => "oidc_id_token",\n            Self::KerberosTicket { .. } => "kerberos_ticket",\n            Self::BiometricHash { .. } => "biometric_hash",\n            Self::HardwareTokenSignature { .. } => "hardware_token_signature",\n        };\n        f.debug_struct("AuthCredential")\n            .field("type", &credential_type)\n            .field("value", &"[REDACTED]")\n            .finish()\n    }\n}\n\nimpl Serialize for AuthCredential {\n    fn serialize<S>(&self, serializer: S) -> Result<S::Ok, S::Error>\n    where\n        S: serde::Serializer,\n    {\n        let credential_type = match self {\n            Self::Password { .. } => "password",\n            Self::JwtToken { .. } => "jwt_token",\n            Self::OAuth2Token { .. } => "oauth2_token",\n            Self::Scram { .. } => "scram",\n            Self::ApiKey { .. } => "api_key",\n            Self::Certificate { .. } => "certificate",\n            Self::LdapBind { .. } => "ldap_bind",\n            Self::SamlAssertion { .. } => "saml_assertion",\n            Self::OidcIdToken { .. } => "oidc_id_token",\n            Self::KerberosTicket { .. } => "kerberos_ticket",\n            Self::BiometricHash { .. } => "biometric_hash",\n            Self::HardwareTokenSignature { .. } => "hardware_token_signature",\n        };\n        let mut state = serializer.serialize_struct("AuthCredential", 2)?;\n        state.serialize_field("type", credential_type)?;\n        state.serialize_field("value", "[REDACTED]")?;\n        state.end()\n    }\n}\n\n'''
          if credential_marker not in text:
              raise SystemExit("AuthCredential insertion marker not found")
          text = text.replace(credential_marker, credential_impl + credential_marker, 1)
          text = text.replace(
              "#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct AuthResult",
              "#[derive(Clone, Serialize, Deserialize)]\npub struct AuthResult",
              1,
          )
          result_marker = "// ── Provider Trait"
          result_impl = '''impl fmt::Debug for AuthResult {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        f.debug_struct("AuthResult")\n            .field("subject", &"[PSEUDONYMOUS]")\n            .field("provider", &self.provider)\n            .field("roles", &self.roles)\n            .field("ttl_seconds", &self.ttl_seconds)\n            .field("claim_keys", &self.claims.keys().collect::<Vec<_>>())\n            .field("issued_at", &self.issued_at)\n            .finish()\n    }\n}\n\n'''
          text = text.replace(result_marker, result_impl + result_marker, 1)
          old_claims = '''        let mut claims = HashMap::new();\n        if let Some(obj) = payload.as_object() {\n            for (k, v) in obj {\n                if let Some(s) = v.as_str() {\n                    claims.insert(k.clone(), s.to_string());\n                }\n            }\n        }'''
          new_claims = '''        let mut claims = HashMap::new();\n        const SAFE_CLAIMS: &[&str] = &["aud", "iss", "jti", "azp"];\n        if let Some(obj) = payload.as_object() {\n            for (key, value) in obj {\n                if SAFE_CLAIMS.contains(&key.as_str()) {\n                    if let Some(value) = value.as_str() {\n                        claims.insert(key.clone(), value.to_string());\n                    }\n                }\n            }\n        }'''
          if old_claims not in text:
              raise SystemExit("JWT claims block not found")
          text = text.replace(old_claims, new_claims, 1)
          write(path, text)

          # In-memory secret values zeroize on drop and never reveal Debug output.
          path = "crates/common/src/secrets_manager.rs"
          text = read(path)
          text = text.replace(
              "use std::sync::RwLock;",
              "use std::sync::RwLock;\nuse zeroize::{Zeroize, ZeroizeOnDrop};",
              1,
          )
          text = text.replace(
              "#[derive(Debug, Clone, PartialEq, Eq)]\npub enum SecretValue",
              "#[derive(Clone, PartialEq, Eq, Zeroize, ZeroizeOnDrop)]\npub enum SecretValue",
              1,
          )
          secret_marker = "/// Secret reference (not the actual secret)"
          secret_debug = '''impl std::fmt::Debug for SecretValue {\n    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {\n        let kind = match self {\n            Self::Text(_) => "Text",\n            Self::Binary(_) => "Binary",\n            Self::Opaque(_) => "Opaque",\n        };\n        f.debug_tuple("SecretValue").field(&kind).field(&"[REDACTED]").finish()\n    }\n}\n\n'''
          text = text.replace(secret_marker, secret_debug + secret_marker, 1)
          text = text.replace(
              "                    matched_text: mat.as_str().to_string(),\n                    start: mat.start(),",
              "                    masked_text: mask_detected_secret(mat.as_str()),\n                    fingerprint: fingerprint_detected_secret(mat.as_str()),\n                    start: mat.start(),",
              1,
          )
          text = text.replace(
              "pub struct DetectedSecret {\n    pub secret_type: String,\n    pub matched_text: String,",
              "pub struct DetectedSecret {\n    pub secret_type: String,\n    pub masked_text: String,\n    pub fingerprint: String,",
              1,
          )
          detected_marker = "#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct DetectedSecret"
          detected_helpers = '''fn mask_detected_secret(value: &str) -> String {\n    if value.len() <= 6 {\n        return "*".repeat(value.len());\n    }\n    format!("{}…{}", &value[..3], &value[value.len() - 3..])\n}\n\nfn fingerprint_detected_secret(value: &str) -> String {\n    let mut hasher = Sha256::new();\n    hasher.update(value.as_bytes());\n    let digest = format!("{:x}", hasher.finalize());\n    digest[..16].to_string()\n}\n\n'''
          text = text.replace(detected_marker, detected_helpers + detected_marker, 1)
          text = text.replace(".matched_text", ".masked_text")
          write(path, text)

          # Do not retain raw webhook bodies. Unsigned integrations fail closed;
          # the integration with a complete signing specification is verified.
          path = "crates/im-integration/src/lib.rs"
          text = read(path)
          text = text.replace(
              "use serde::{Deserialize, Serialize};",
              "use hmac::{Hmac, Mac};\nuse serde::{Deserialize, Serialize};",
              1,
          )
          text = text.replace("raw_data: Some(body.clone()),", "raw_data: None,")

          def replace_verify_in_section(text, section_start, section_end, body):
              start = text.index(section_start)
              end = text.index(section_end, start)
              section = text[start:end]
              pattern = re.compile(
                  r"    fn verify_signature\(&self, _headers: &HashMap<String, String>, _body: &\[u8\]\) -> bool \{.*?\n    \}",
                  re.S,
              )
              updated, count = pattern.subn(body, section, count=1)
              if count != 1:
                  raise SystemExit(f"signature function not found in {section_start}")
              return text[:start] + updated + text[end:]

          fail_closed = '''    fn verify_signature(&self, _headers: &HashMap<String, String>, _body: &[u8]) -> bool {\n        // Fail closed until the adapter's official signature scheme is configured.\n        false\n    }'''
          text = replace_verify_in_section(text, "impl PlatformAdapter for WechatAdapter", "/// Telegram适配器", fail_closed)
          text = replace_verify_in_section(text, "impl PlatformAdapter for TelegramAdapter", "/// Slack适配器", fail_closed)

          slack_verify = '''    fn verify_signature(&self, headers: &HashMap<String, String>, body: &[u8]) -> bool {\n        let Some(secret) = self.signing_secret.as_deref() else {\n            return false;\n        };\n        let signature = headers\n            .iter()\n            .find(|(key, _)| key.eq_ignore_ascii_case("x-slack-signature"))\n            .map(|(_, value)| value.as_str());\n        let timestamp = headers\n            .iter()\n            .find(|(key, _)| key.eq_ignore_ascii_case("x-slack-request-timestamp"))\n            .map(|(_, value)| value.as_str());\n        let (Some(signature), Some(timestamp)) = (signature, timestamp) else {\n            return false;\n        };\n        let Ok(timestamp_value) = timestamp.parse::<i64>() else {\n            return false;\n        };\n        if (chrono::Utc::now().timestamp() - timestamp_value).abs() > 300 {\n            return false;\n        }\n        let Some(signature_hex) = signature.strip_prefix("v0=") else {\n            return false;\n        };\n        let Ok(signature_bytes) = hex::decode(signature_hex) else {\n            return false;\n        };\n        let Ok(mut mac) = Hmac::<sha2::Sha256>::new_from_slice(secret.as_bytes()) else {\n            return false;\n        };\n        mac.update(format!("v0:{timestamp}:").as_bytes());\n        mac.update(body);\n        mac.verify_slice(&signature_bytes).is_ok()\n    }'''
          text = replace_verify_in_section(text, "impl PlatformAdapter for SlackAdapter", "/// 飞书适配器", slack_verify)
          text = replace_verify_in_section(text, "impl PlatformAdapter for FeishuAdapter", "/// IM集成管理器", fail_closed)
          text = text.replace(
              "fn test_all_adapters_verify_signature_always_true()",
              "fn test_unsigned_requests_fail_closed()",
              1,
          )
          text = text.replace("assert!(wechat.verify_signature(&HashMap::new(), b\"body\"));", "assert!(!wechat.verify_signature(&HashMap::new(), b\"body\"));", 1)
          text = text.replace("assert!(telegram.verify_signature(&HashMap::new(), b\"body\"));", "assert!(!telegram.verify_signature(&HashMap::new(), b\"body\"));", 1)
          text = text.replace("assert!(slack.verify_signature(&HashMap::new(), b\"body\"));", "assert!(!slack.verify_signature(&HashMap::new(), b\"body\"));", 1)
          text = text.replace("assert!(feishu.verify_signature(&HashMap::new(), b\"body\"));", "assert!(!feishu.verify_signature(&HashMap::new(), b\"body\"));", 1)
          write(path, text)

          # Suppress raw provider error bodies and remove realistic-looking keys.
          path = "crates/common/src/minimax_client.rs"
          text = read(path)
          old = '''        if !status.is_success() {\n            let text = resp\n                .text()\n                .await\n                .unwrap_or_else(|_| "<unreadable body>".to_string());\n            return Err(KiasError::ExternalService(format!(\n                "MiniMax API returned {status}: {text}"\n            )));\n        }'''
          new = '''        if !status.is_success() {\n            return Err(KiasError::ExternalService(format!(\n                "model provider returned HTTP {status}; response body suppressed"\n            )));\n        }'''
          if old not in text:
              raise SystemExit("provider error-body block not found")
          text = text.replace(old, new, 1)
          write(path, text)

          example = Path("config/example.toml")
          if example.exists():
              content = example.read_text("utf-8")
              content = content.replace('api_key = "sk-00000000000000000000000000000000"', 'api_key = "${MODEL_PROVIDER_API_KEY}"')
              example.write_text(content, "utf-8")

          # The remediation workflow is intentionally one-shot and must not be merged.
          Path(".github/workflows/privacy-remediation.yml").unlink()
          PY

      - name: Format Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          cargo fmt --all

      - name: Validate remediated crates
        run: |
          cargo test -p kias-common -p kias-api-server -p compliance-security -p im-integration
          cargo check --workspace --all-features

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: apply code privacy remediation [privacy-remediation]"
          git push origin HEAD:agent/privacy-hardening
