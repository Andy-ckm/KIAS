name: Preview bounded formatting

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: bounded-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Correct provider-token rule in preview
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/privacy_scan.py')
          text = path.read_text('utf-8')
          old = r're.compile(r"\b(?:sk|pk|xox[baprs]|api)[-_][A-Za-z0-9_-]{20,}\b", re.I),'
          new = r're.compile(r"\b(?:sk|pk|xox[baprs])[-_][A-Za-z0-9_-]{20,}\b", re.I),'
          if text.count(old) != 1:
              raise SystemExit('provider-token rule did not match exactly once')
          path.write_text(text.replace(old, new), 'utf-8')
          PY

      - name: Format Rust sources and verify privacy
        run: |
          cargo fmt --all
          python3 scripts/privacy_scan.py --repo . --output privacy-scan.json --fail-on high
          git diff --name-status > format-files.txt
          git diff --binary > format.patch
          tar -czf formatted-files.tar.gz $(git diff --name-only --diff-filter=AM)
          cat format-files.txt

      - name: Upload reviewed formatting preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bounded-format-preview
          path: |
            format-files.txt
            format.patch
            formatted-files.tar.gz
            privacy-scan.json
          retention-days: 1
