  - id: R033
    topic: "服务管理（systemd/nginx/mysql/redis）"
    keywords: ["Linux service management", "systemd automation", "nginx management", "database operations"]
    status: done
    priority: high
    findings: |
      实现: service_manager.rs — ServiceManager引擎, 19种ServiceAction
      systemd操作: start/stop/restart/status/enable/disable/logs/list-units/list-failed/daemon-reload
      nginx操作: reload(test+reload)/test-config/status
