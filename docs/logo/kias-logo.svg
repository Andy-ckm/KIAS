<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C42;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D5F8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Abstract AI Agent symbol -->
  <g transform="translate(20, 30)">
    <!-- Outer hexagon -->
    <polygon points="80,0 150,40 150,120 80,160 10,120 10,40" 
             fill="url(#grad2)" stroke="url(#grad1)" stroke-width="3"/>
    
    <!-- Inner circuit pattern -->
    <circle cx="80" cy="80" r="25" fill="url(#grad1)" opacity="0.9"/>
    <circle cx="80" cy="80" r="15" fill="white"/>
    <circle cx="80" cy="80" r="5" fill="url(#grad2)"/>
    
    <!-- Connection lines -->
    <line x1="80" y1="55" x2="80" y2="30" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="80" y1="105" x2="80" y2="130" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="55" y1="80" x2="30" y2="80" stroke="url(#grad1)" stroke-width="2"/>
    <line x1="105" y1="80" x2="130" y2="80" stroke="url(#grad1)" stroke-width="2"/>
    
    <!-- Corner nodes -->
    <circle cx="80" cy="25" r="6" fill="url(#grad1)"/>
    <circle cx="80" cy="135" r="6" fill="url(#grad1)"/>
    <circle cx="25" cy="80" r="6" fill="url(#grad1)"/>
    <circle cx="135" cy="80" r="6" fill="url(#grad1)"/>
  </g>
  
  <!-- Text: KIAS -->
  <text x="200" y="115" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="bold" fill="url(#grad2)">
    KIAS
  </text>
  
  <!-- Tagline -->
  <text x="200" y="155" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#666666" letter-spacing="4">
    ENTERPRISE AI AGENT FRAMEWORK
  </text>
  
  <!-- Version badge -->
  <rect x="650" y="70" width="120" height="30" rx="15" fill="url(#grad1)"/>
  <text x="710" y="90" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">
    v0.1.0
  </text>
</svg>
