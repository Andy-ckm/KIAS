name: Cargo lockfile preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lockfile-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Refresh Cargo lockfile
        run: cargo generate-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          retention-days: 1
