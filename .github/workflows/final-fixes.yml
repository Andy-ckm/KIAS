name: Apply final hardening fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true
          fetch-depth: 1

      - name: Apply focused source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text('utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'expected at least {count} match(es) in {path}, got {found}: {old[:100]!r}')
              file.write_text(text.replace(old, new, count), 'utf-8')

          replace(
              'crates/cache/src/strategy.rs',
              'for (key, _) in entries.iter() {',
              'for key in entries.keys() {',
          )

          replace(
              'crates/common/src/tls.rs',
              'let key = b"not a pem file";\n        let err = validate_pem_files(cert, key.as_bytes()).unwrap_err();',
              'let key = b"not a pem file";\n        let err = validate_pem_files(cert, key).unwrap_err();',
          )

          replace(
              'crates/common/src/metrics.rs',
              '.find(|mf| mf.get_name() == "kias_scheduler_latency_seconds")',
              '.find(|mf| mf.name() == "kias_scheduler_latency_seconds")',
          )

          replace(
              'dashboard/src/components/Common.tsx',
              "\nimport type { AgentStatus } from '../types';\n",
              '\n',
          )

          replace(
              'dashboard/src/pages/Scheduler.tsx',
              "\nconst COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];\n",
              '\n',
          )

          replace(
              'dashboard/src/pages/Workflows.tsx',
              "import { StatusBadge, StatCard, Spinner, ErrorBanner, EmptyState } from '../components/Common';",
              "import { StatCard, Spinner, ErrorBanner, EmptyState } from '../components/Common';",
          )
          replace(
              'dashboard/src/pages/Workflows.tsx',
              'const [deleting, setDeleting] = useState<string | null>(null);',
              'const [, setDeleting] = useState<string | null>(null);',
          )

          replace(
              'dashboard/src/hooks/useApi.ts',
              '// eslint-disable-next-line react-hooks/exhaustive-deps\n  }, deps);',
              '// The hook intentionally accepts a caller-supplied dependency list.\n    // eslint-disable-next-line react-hooks/exhaustive-deps, react-hooks/use-memo\n  }, deps);',
          )

          replace(
              'Cargo.toml',
              'sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }',
              'sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }',
          )
          replace(
              'crates/data-store/Cargo.toml',
              'sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }',
              'sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }',
          )
          replace(
              'crates/data-store/Cargo.toml',
              'tantivy = "0.22"',
              'tantivy = "0.26"',
          )

          for temporary in (
              '.post-remediation-diagnostics.tmp.md',
              '.hardening-diagnostics.tmp.md',
          ):
              Path(temporary).unlink(missing_ok=True)
          PY

      - name: Refresh lockfiles and frontend advisories
        shell: bash
        run: |
          set +e
          : > /tmp/update.log
          for command in \
            'cargo update -p sqlx --precise 0.8.6' \
            'cargo update -p tantivy --precise 0.26.0' \
            'cargo update -p lru --precise 0.16.3'
          do
            echo "> $command" | tee -a /tmp/update.log
            bash -lc "$command" >>/tmp/update.log 2>&1
            echo "exit=$?" >>/tmp/update.log
          done
          (
            cd dashboard
            npm audit fix --package-lock-only --ignore-scripts
          ) >>/tmp/update.log 2>&1
          echo "npm-audit-fix-exit=$?" >>/tmp/update.log

      - name: Validate and create masked diagnostics
        shell: bash
        env:
          ORGANIZATION_DENYLIST_B64: ${{ secrets.ORGANIZATION_DENYLIST_B64 }}
        run: |
          set +e
          rustup update stable >/tmp/rustup.log 2>&1
          rustup default stable >>/tmp/rustup.log 2>&1
          rustup component add rustfmt clippy >>/tmp/rustup.log 2>&1
          cargo fmt --all

          cargo check --workspace --all-features >/tmp/check.log 2>&1
          check_status=$?
          cargo clippy --workspace --all-targets --all-features -- -D warnings >/tmp/clippy.log 2>&1
          clippy_status=$?
          cargo test --workspace --all-features >/tmp/tests.log 2>&1
          tests_status=$?
          (cd dashboard && npm ci --ignore-scripts && npm run lint && npm run build && npm audit --audit-level=high) >/tmp/npm.log 2>&1
          npm_status=$?
          python3 scripts/privacy_scan.py --repo . --output /tmp/privacy.json --fail-on high >/tmp/privacy-command.log 2>&1
          privacy_status=$?

          cargo install cargo-audit --version 0.22.2 --locked >/tmp/audit-install.log 2>&1
          if [ $? -eq 0 ]; then
            cargo audit >/tmp/audit.log 2>&1
            audit_status=$?
          else
            cp /tmp/audit-install.log /tmp/audit.log
            audit_status=1
          fi

          cargo tree -i rsa --target all >/tmp/rsa-tree.log 2>&1
          rsa_status=$?
          cargo tree -i lru --target all >/tmp/lru-tree.log 2>&1
          lru_status=$?

          cat >/tmp/statuses <<EOF
          check=$check_status
          clippy=$clippy_status
          tests=$tests_status
          npm=$npm_status
          privacy=$privacy_status
          audit=$audit_status
          rsa_tree=$rsa_status
          lru_tree=$lru_status
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          def tail(path: str, count: int) -> str:
              source = Path(path)
              if not source.exists():
                  return '<not generated>'
              return '\n'.join(source.read_text('utf-8', errors='replace').splitlines()[-count:])

          statuses = {}
          for line in Path('/tmp/statuses').read_text('utf-8').splitlines():
              key, value = line.strip().split('=', 1)
              statuses[key] = value

          privacy_rows = []
          if Path('/tmp/privacy.json').exists():
              report = json.loads(Path('/tmp/privacy.json').read_text('utf-8'))
              privacy_rows.append(f"summary={json.dumps(report.get('summary', {}), sort_keys=True)}")
              for finding in report.get('findings', []):
                  if finding.get('severity') in {'critical', 'high'}:
                      privacy_rows.append(
                          f"{finding['severity']} {finding['path']}:{finding['line']} "
                          f"{finding['kind']} {finding['masked']} fingerprint={finding['fingerprint']}"
                      )

          sections = [
              '# Temporary final validation diagnostics',
              '',
              f"Statuses: `{json.dumps(statuses, sort_keys=True)}`",
              '',
              '## Updates', '```text', tail('/tmp/update.log', 140), '```',
              '',
              '## cargo check', '```text', tail('/tmp/check.log', 100), '```',
              '',
              '## Clippy', '```text', tail('/tmp/clippy.log', 160), '```',
              '',
              '## Tests', '```text', tail('/tmp/tests.log', 180), '```',
              '',
              '## Dashboard', '```text', tail('/tmp/npm.log', 140), '```',
              '',
              '## RustSec', '```text', tail('/tmp/audit.log', 180), '```',
              '',
              '## Masked privacy findings', '```text', '\n'.join(privacy_rows[:100]) or '<none>', '```',
              '',
              '## rsa reverse tree', '```text', tail('/tmp/rsa-tree.log', 100), '```',
              '',
              '## lru reverse tree', '```text', tail('/tmp/lru-tree.log', 100), '```',
          ]
          Path('.final-validation-diagnostics.tmp.md').write_text('\n'.join(sections), 'utf-8')
          PY

      - name: Commit fixes and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve final CI, frontend, and dependency findings"
          git push origin HEAD:agent/privacy-hardening
