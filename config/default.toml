# KIAS runtime configuration
#
# Nested environment overrides use a double underscore, for example:
#   KIAS_API_SERVER__PORT=9090
#   KIAS_API_SERVER__JWT_SECRET=<runtime-secret>
#
# Do not place real credentials in this file. Provide them at runtime through
# environment injection or an external secret provider.

[logging]
level = "info"
format = "text"

[api_server]
host = "127.0.0.1"
port = 8080
tls = false
tls_min_version = "1.3"
auth_enabled = true
auth_tokens = []
jwt_expiration_hours = 24

[scheduler]
algorithm = "resource_aware"
interval_ms = 1000

[controller]
heartbeat_interval_secs = 15
failure_timeout_secs = 60
max_retries = 3

[observability]
enabled = true
metrics_port = 9090

[cache]
enabled = false
max_entries = 10000
ttl_secs = 3600

[knowledge]
enabled = false
embedding_model = "local-default"
embedding_provider = "local"
siliconflow_base_url = ""

[storage]
etcd_endpoints = "http://127.0.0.1:2379"
sqlite_url = "sqlite://kias.db"
cache_mode = "sqlite"