name: Apply reviewed compatibility fixes once

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: compatibility-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      - name: Apply reviewed replacements with fixed match counts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_literal(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text('utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} literal matches, found {count}: {old!r}')
              target.write_text(text.replace(old, new), 'utf-8')
              print(f'{path}: replaced {count} literal match(es)')

          def replace_regex(path: str, pattern: str, replacement: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text('utf-8')
              updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE | re.DOTALL)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} regex matches, found {count}: {pattern!r}')
              target.write_text(updated, 'utf-8')
              print(f'{path}: replaced {count} regex match(es)')

          replace_literal(
              'crates/cache/src/strategy.rs',
              'for (key, _) in entries.iter() {',
              'for key in entries.keys() {',
          )
          replace_regex(
              'crates/mcp-protocol/src/server.rs',
              r'use crate::capabilities::\{\s*ClientCapabilities,\s*PromptsCapability,\s*ResourcesCapability,\s*ToolsCapability,\s*VersionNegotiation,\s*\};',
              'use crate::capabilities::{PromptsCapability, ResourcesCapability, ToolsCapability};',
          )
          replace_regex(
              'crates/mcp-protocol/src/sandbox.rs',
              r'struct DockerContainerInfo \{\s*container_id: String,\s*start_time: std::time::Instant,\s*\}',
              'struct DockerContainerInfo {\n    start_time: std::time::Instant,\n}',
          )
          replace_regex(
              'crates/mcp-protocol/src/sandbox.rs',
              r'let info = DockerContainerInfo \{\s*container_id: cid\.clone\(\),\s*start_time: std::time::Instant::now\(\),\s*\};',
              'let info = DockerContainerInfo {\n            start_time: std::time::Instant::now(),\n        };',
          )
          replace_regex(
              'crates/mcp-protocol/src/sandbox.rs',
              r'struct GVisorContainerInfo \{\s*container_id: String,\s*start_time: std::time::Instant,\s*\}',
              'struct GVisorContainerInfo {\n    start_time: std::time::Instant,\n}',
          )
          replace_regex(
              'crates/mcp-protocol/src/sandbox.rs',
              r'let info = GVisorContainerInfo \{\s*container_id: cid\.clone\(\),\s*start_time: std::time::Instant::now\(\),\s*\};',
              'let info = GVisorContainerInfo {\n            start_time: std::time::Instant::now(),\n        };',
          )
          replace_literal('crates/mcp-protocol/src/sandbox.rs', '    runsc_bin: String,', '    _runsc_bin: String,')
          replace_literal(
              'crates/mcp-protocol/src/sandbox.rs',
              '            runsc_bin: "runsc".to_string(),',
              '            _runsc_bin: "runsc".to_string(),',
          )
          replace_literal(
              'crates/mcp-protocol/src/sandbox.rs',
              '            runsc_bin: bin.into(),',
              '            _runsc_bin: bin.into(),',
          )
          replace_literal(
              'dashboard/src/pages/AgentDetail.tsx',
              "formatter={(value: number, name: string) => [",
              "formatter={(value, name) => [",
          )
          replace_literal(
              'dashboard/src/pages/AgentDetail.tsx',
              "name === 'cpu_percent' ? `${value.toFixed(1)}%` : `${value.toFixed(0)} MB`,",
              "String(name) === 'cpu_percent' ? `${Number(value ?? 0).toFixed(1)}%` : `${Number(value ?? 0).toFixed(0)} MB`,",
          )
          replace_literal(
              'dashboard/src/pages/AgentDetail.tsx',
              "name === 'cpu_percent' ? 'CPU' : 'Memory',",
              "String(name) === 'cpu_percent' ? 'CPU' : 'Memory',",
          )
          replace_literal(
              'dashboard/src/pages/AgentDetail.tsx',
              "formatter={(value: number) => [`${value.toLocaleString()} tokens`, 'Tokens']}",
              "formatter={value => [`${Number(value ?? 0).toLocaleString()} tokens`, 'Tokens']}",
          )
          replace_literal(
              'dashboard/src/pages/Tokens.tsx',
              "formatter={(value: number, name: string) => [formatTokens(value), name === 'input_tokens' ? 'Input' : 'Output']}",
              "formatter={(value, name) => [formatTokens(Number(value ?? 0)), String(name) === 'input_tokens' ? 'Input' : 'Output']}",
          )
          replace_literal(
              'dashboard/src/pages/Tokens.tsx',
              "formatter={(value: number) => formatTokens(value)}",
              "formatter={value => formatTokens(Number(value ?? 0))}",
          )
          replace_literal(
              'dashboard/src/pages/Tokens.tsx',
              "formatter={(value: number, name: string) => [formatTokens(value), name === 'input' ? 'Input' : 'Output']}",
              "formatter={(value, name) => [formatTokens(Number(value ?? 0)), String(name) === 'input' ? 'Input' : 'Output']}",
          )
          PY

      - name: Validate targeted Rust changes
        id: rust_validation
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo test -p kias-cache -p kias-mcp-protocol --all-features --locked --quiet
            cargo clippy -p kias-cache -p kias-mcp-protocol --all-targets --all-features --locked -- -D warnings
          } 2>&1 | tee /tmp/compat-rust.log

      - name: Upload Rust compatibility diagnostics
        if: steps.rust_validation.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-rust-diagnostics
          path: /tmp/compat-rust.log
          retention-days: 1

      - name: Validate dashboard
        id: dashboard_validation
        if: steps.rust_validation.outcome == 'success'
        continue-on-error: true
        working-directory: dashboard
        run: |
          set -o pipefail
          {
            npm ci --ignore-scripts
            npm run lint -- --max-warnings=0
            npm run build
          } 2>&1 | tee /tmp/compat-dashboard.log

      - name: Upload dashboard compatibility diagnostics
        if: steps.dashboard_validation.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-dashboard-diagnostics
          path: /tmp/compat-dashboard.log
          retention-days: 1

      - name: Stop after validation failure
        if: steps.rust_validation.outcome == 'failure' || steps.dashboard_validation.outcome == 'failure'
        run: exit 1

      - name: Commit exact reviewed file set and remove workflow
        if: steps.rust_validation.outcome == 'success' && steps.dashboard_validation.outcome == 'success'
        run: |
          rm -f .github/workflows/compatibility-fixes-once.yml
          allowed='^(crates/cache/src/strategy.rs|crates/mcp-protocol/src/server.rs|crates/mcp-protocol/src/sandbox.rs|dashboard/src/pages/AgentDetail.tsx|dashboard/src/pages/Tokens.tsx|.github/workflows/compatibility-fixes-once.yml)$'
          unexpected="$(git status --short | sed 's/^...//' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed:'
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/cache/src/strategy.rs crates/mcp-protocol/src/server.rs \
            crates/mcp-protocol/src/sandbox.rs dashboard/src/pages/AgentDetail.tsx \
            dashboard/src/pages/Tokens.tsx .github/workflows/compatibility-fixes-once.yml
          git commit -m "fix: resolve Rust and dashboard compatibility errors"
          git push origin HEAD:agent/privacy-hardening
