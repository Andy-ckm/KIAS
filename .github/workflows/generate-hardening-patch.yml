name: Generate reviewed hardening patch

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening') }}
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: false
          fetch-depth: 1

      - name: Apply candidate fixes in the ephemeral workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text('utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'expected at least {count} match(es) in {path}, got {found}: {old[:100]!r}')
              file.write_text(text.replace(old, new, count), 'utf-8')

          replace(
              'crates/cache/src/strategy.rs',
              'for (key, _) in entries.iter() {',
              'for key in entries.keys() {',
          )
          replace(
              'crates/common/src/tls.rs',
              'let key = b"not a pem file";\n        let err = validate_pem_files(cert, key.as_bytes()).unwrap_err();',
              'let key = b"not a pem file";\n        let err = validate_pem_files(cert, key).unwrap_err();',
          )
          replace(
              'crates/common/src/metrics.rs',
              '.find(|mf| mf.get_name() == "kias_scheduler_latency_seconds")',
              '.find(|mf| mf.name() == "kias_scheduler_latency_seconds")',
          )
          replace(
              'dashboard/src/components/Common.tsx',
              "\nimport type { AgentStatus } from '../types';\n",
              '\n',
          )
          replace(
              'dashboard/src/pages/Scheduler.tsx',
              "\nconst COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];\n",
              '\n',
          )
          replace(
              'dashboard/src/pages/Workflows.tsx',
              "import { StatusBadge, StatCard, Spinner, ErrorBanner, EmptyState } from '../components/Common';",
              "import { StatCard, Spinner, ErrorBanner, EmptyState } from '../components/Common';",
          )
          replace(
              'dashboard/src/pages/Workflows.tsx',
              'const [deleting, setDeleting] = useState<string | null>(null);',
              'const [, setDeleting] = useState<string | null>(null);',
          )
          replace(
              'dashboard/src/hooks/useApi.ts',
              '// eslint-disable-next-line react-hooks/exhaustive-deps\n  }, deps);',
              '// This reusable hook intentionally accepts a caller-supplied dependency list.\n    // eslint-disable-next-line react-hooks/exhaustive-deps, react-hooks/use-memo\n  }, deps);',
          )
          replace(
              'Cargo.toml',
              'sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }',
              'sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }',
          )
          replace(
              'crates/data-store/Cargo.toml',
              'sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }',
              'sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }',
          )
          replace(
              'crates/data-store/Cargo.toml',
              'tantivy = "0.22"',
              'tantivy = "0.26"',
          )
          PY

      - name: Refresh dependency lockfiles
        shell: bash
        run: |
          set +e
          : > /tmp/update.log
          for command in \
            'cargo update -p sqlx --precise 0.8.6' \
            'cargo update -p tantivy --precise 0.26.0' \
            'cargo update -p lru --precise 0.16.3'
          do
            echo "> $command" | tee -a /tmp/update.log
            bash -lc "$command" >>/tmp/update.log 2>&1
            echo "exit=$?" >>/tmp/update.log
          done
          (
            cd dashboard
            npm audit fix --package-lock-only --ignore-scripts
          ) >>/tmp/update.log 2>&1
          echo "npm-audit-fix-exit=$?" >>/tmp/update.log

      - name: Validate candidate patch
        shell: bash
        env:
          ORGANIZATION_DENYLIST_B64: ${{ secrets.ORGANIZATION_DENYLIST_B64 }}
        run: |
          set +e
          rustup update stable >/tmp/rustup.log 2>&1
          rustup default stable >>/tmp/rustup.log 2>&1
          rustup component add rustfmt clippy >>/tmp/rustup.log 2>&1
          cargo fmt --all

          cargo check --workspace --all-features >/tmp/check.log 2>&1
          check_status=$?
          cargo clippy --workspace --all-targets --all-features -- -D warnings >/tmp/clippy.log 2>&1
          clippy_status=$?
          cargo test --workspace --all-features >/tmp/tests.log 2>&1
          tests_status=$?
          (cd dashboard && npm ci --ignore-scripts && npm run lint && npm run build && npm audit --audit-level=high) >/tmp/npm.log 2>&1
          npm_status=$?
          python3 scripts/privacy_scan.py --repo . --output /tmp/privacy.json --fail-on high >/tmp/privacy-command.log 2>&1
          privacy_status=$?

          cargo install cargo-audit --version 0.22.2 --locked >/tmp/audit-install.log 2>&1
          if [ $? -eq 0 ]; then
            cargo audit >/tmp/audit.log 2>&1
            audit_status=$?
          else
            cp /tmp/audit-install.log /tmp/audit.log
            audit_status=1
          fi

          cat >/tmp/statuses <<EOF
          check=$check_status
          clippy=$clippy_status
          tests=$tests_status
          npm=$npm_status
          privacy=$privacy_status
          audit=$audit_status
          EOF

      - name: Package changed files and masked diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hardening-artifact/files
          git diff --binary > hardening-artifact/changes.patch
          git diff --name-only > hardening-artifact/changed-files.txt
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "hardening-artifact/files/$(dirname "$file")"
            cp "$file" "hardening-artifact/files/$file"
          done < hardening-artifact/changed-files.txt

          cp /tmp/statuses hardening-artifact/statuses.txt 2>/dev/null || true
          cp /tmp/update.log hardening-artifact/update.log 2>/dev/null || true
          cp /tmp/check.log hardening-artifact/check.log 2>/dev/null || true
          cp /tmp/clippy.log hardening-artifact/clippy.log 2>/dev/null || true
          cp /tmp/tests.log hardening-artifact/tests.log 2>/dev/null || true
          cp /tmp/npm.log hardening-artifact/npm.log 2>/dev/null || true
          cp /tmp/audit.log hardening-artifact/audit.log 2>/dev/null || true

          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/privacy.json')
          target = Path('hardening-artifact/privacy-masked.json')
          if not source.exists():
              target.write_text('{}', 'utf-8')
          else:
              report = json.loads(source.read_text('utf-8'))
              report['findings'] = [
                  finding for finding in report.get('findings', [])
                  if finding.get('severity') in {'critical', 'high'}
              ]
              target.write_text(json.dumps(report, ensure_ascii=False, indent=2), 'utf-8')
          PY

      - name: Upload reviewed patch candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardening-patch-candidate
          path: hardening-artifact
          retention-days: 3
          if-no-files-found: error
