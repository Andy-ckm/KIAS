name: Run one-shot privacy remediation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  remediate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/privacy-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true
          fetch-depth: 0

      - name: Execute reviewed remediation script
        id: remediation
        continue-on-error: true
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/privacy-remediation.log
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/privacy-remediation.yml').read_text('utf-8')
          begin_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          begin = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, begin)
          script = textwrap.dedent(workflow[begin:end])
          exec(compile(script, 'privacy-remediation', 'exec'), {'__name__': '__main__'})
          PY

      - name: Report remediation failure
        if: steps.remediation.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'The one-shot privacy remediation stopped before committing changes.'
            echo
            echo '```text'
            tail -n 80 /tmp/privacy-remediation.log
            echo '```'
          } > /tmp/remediation-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/remediation-comment.md
          exit 1

      - name: Format and validate remediated code
        if: steps.remediation.outcome == 'success'
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt
          cargo fmt --all
          cargo test -p kias-common -p kias-api-server -p compliance-security -p im-integration
          cargo check --workspace --all-features

      - name: Remove one-shot trigger and commit
        if: steps.remediation.outcome == 'success'
        run: |
          rm -f .github/workflows/privacy-remediation-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: apply code privacy remediation [privacy-remediation]"
          git push origin HEAD:agent/privacy-hardening
