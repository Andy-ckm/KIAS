name: Product maintenance preview

on:
  push:
    branches:
      - agent/privacy-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-maintenance-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust tooling
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Format Rust and refresh lockfile offline
        run: |
          cargo fmt --all
          cargo generate-lockfile --offline

      - name: Upload reviewed maintenance outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-maintenance-preview
          path: |
            Cargo.lock
            crates/api-server/src/lib.rs
            crates/api-server/src/routes/product.rs
            crates/api-server/src/surfaces.rs
            crates/kias-main/src/main.rs
          retention-days: 3
