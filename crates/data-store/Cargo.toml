[package]
name = "kias-data-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KIAS data layer: SQLite repository, vector persistence, cache persistence, and migrations"

[[bin]]
name = "kias-data-store"
path = "src/main.rs"

[dependencies]
kias-common.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
uuid.workspace = true
chrono.workspace = true

# SQLite via sqlx
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# DashMap for in-memory vector persistence
dashmap.workspace = true

# Knowledge crate for HNSW vector index
kias-knowledge = { path = "../knowledge" }

[features]
default = []
# Use battle-tested hnsw_rs crate instead of hand-rolled HNSW in kias-knowledge.
# TODO(#real-hnsw): Wire up hnsw_rs behind this flag for production use.
# real-hnsw = ["hnsw_rs"]
# hnsw_rs = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
