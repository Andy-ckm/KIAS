[package]
name = "kias-cli"
version = "0.1.0"
edition = "2021"
description = "KIAS CLI - Enterprise Agent Management Tool (超越阿里云 AgentRun)"

[dependencies]
kias-common = { path = "../common" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2"
tabled = "0.15"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
dirs = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
