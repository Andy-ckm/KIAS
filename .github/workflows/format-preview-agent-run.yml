name: Apply reviewed Agent Run rustfmt once

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - "crates/api-server/**"
      - "crates/executor/**"
      - "docs/project-status.md"
      - ".github/workflows/format-preview-agent-run.yml"

permissions:
  contents: write

concurrency:
  group: apply-reviewed-agent-run-rustfmt-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/privacy-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/privacy-hardening
          persist-credentials: true

      - name: Install stable Rust with rustfmt
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt

      - name: Apply reviewed formatting and enforce exact scope
        run: |
          set -euo pipefail
          cargo fmt --all
          bash -n scripts/runtime-smoke-agent-run.sh
          git diff --check
          git rm .github/workflows/format-preview-agent-run.yml

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/format-preview-agent-run.yml' \
            'crates/api-server/src/run_service.rs' \
            'crates/executor/src/docker_sandbox.rs' | sort)"
          test "${changed}" = "${expected}"
          git add -A

      - name: Validate focused crates
        run: |
          cargo test --locked -p kias-executor -p kias-api-server -p kias-main
          cargo clippy --locked -p kias-executor -p kias-api-server -p kias-main --all-targets -- -D warnings
          cargo fmt --all -- --check

      - name: Commit reviewed formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format Agent Run implementation"
          git push origin HEAD:agent/privacy-hardening
